create_session:
  name: Create Session
  description: Launch a new browser session on the mesh.
  fields:
    profile:
      name: Profile
      description: Name of saved profile to load (e.g., hrworks, work).
      example: hrworks
      selector:
        text:
    engine:
      name: Browser Engine
      description: Rendering engine to use.
      example: chromium
      selector:
        select:
          options:
            - chromium
            - firefox
    node:
      name: Node
      description: Target mesh node (e.g. fnuc, rofl-13). Omit for local/auto.
      example: fnuc
      selector:
        text:
    name:
      name: Session Name
      description: Optional human-readable name or label for the session.
      example: hrworks-fetch
      selector:
        text:
    screen:
      name: Screen Mode
      description: Device profile / screen dimensions.
      example: desktop
      selector:
        select:
          options:
            - desktop
            - phone
    idle_timeout_minutes:
      name: Idle Timeout
      description: Idle timeout in minutes before auto-stopping (0 = never).
      example: 15
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: minutes
    record:
      name: Record
      description: Record video of the session.
      selector:
        boolean:
    adblock:
      name: Ad Blocker
      description: Enable ad blocker extension.
      selector:
        boolean:
    default_tabs:
      name: Open Default Tabs
      description: Automatically open default tabs saved for the profile.
      selector:
        boolean:

stop_session:
  name: Stop Session
  description: Terminate an active browser session.
  fields:
    session_id:
      name: Session ID
      description: UUID of the session to terminate.
      required: true
      example: "9dbfef82-5852-4139-8a53-80671d43dee1"
      selector:
        text:
    node:
      name: Node
      description: Node where the session is running.
      selector:
        text:

open_tab:
  name: Open Tab
  description: Open a new tab in the browser.
  fields:
    url:
      name: URL
      description: Web page URL to navigate to.
      required: true
      example: "https://ha.brkn.lol"
      selector:
        text:
    node:
      name: Node
      description: Target mesh node.
      selector:
        text:

close_tab:
  name: Close Tab
  description: Close an open tab by ID.
  fields:
    tab_id:
      name: Tab ID
      description: Chromium target / tab ID.
      required: true
      selector:
        text:
    node:
      name: Node
      description: Target mesh node.
      selector:
        text:

export_auth:
  name: Export Auth
  description: Export cookies and localStorage state (Playwright storageState format) for a page or session.
  fields:
    page_id:
      name: Page ID
      description: Page ID to read storage state from.
      required: true
      selector:
        text:
    session_id:
      name: Session ID
      description: Associated browser session ID.
      selector:
        text:
    storage:
      name: Include Storage
      description: Whether to include localStorage (Playwright storageState format).
      default: true
      selector:
        boolean:
    node:
      name: Node
      description: Target mesh node.
      selector:
        text:

take_screenshot:
  name: Take Screenshot
  description: Capture a live JPEG screenshot of a session.
  fields:
    session_id:
      name: Session ID
      description: UUID of the session to capture.
      required: true
      selector:
        text:
    node:
      name: Node
      description: Target mesh node.
      selector:
        text:

clear_profile:
  name: Clear Profile
  description: Reset cookies and stored state for a named profile.
  fields:
    profile:
      name: Profile Name
      description: Profile to clear.
      required: true
      example: hrworks
      selector:
        text:
    node:
      name: Node
      description: Target mesh node.
      selector:
        text:

vacuum_recordings:
  name: Vacuum Recordings
  description: Clean up expired session recordings across the node/mesh.
  fields:
    node:
      name: Node
      description: Target mesh node.
      selector:
        text:

run:
  name: Run
  description: >-
    Run a Playwright script or a list of steps in a browser of the mesh and
    return the result (see docs/run.md of browser-daemon). Needs the cluster
    secret in the integration.
  fields:
    profile:
      name: Profile
      description: Run in this profile's browser (on whichever node has it).
      example: hrworks
      selector:
        text:
    session_id:
      name: Session ID
      description: Run in this running session instead.
      selector:
        text:
    url:
      name: URL
      description: Address to open before the script or steps.
      example: https://example.org
      selector:
        text:
    steps:
      name: Steps
      description: >-
        Actions run in order, e.g. [{"action": "click", "selector": "text=Sign in"},
        {"action": "text", "selector": "h1", "as": "title"}]. Values of steps with
        `as` end up in the result.
      selector:
        object:
    script:
      name: Script
      description: >-
        A JavaScript function expression, `async ({ page, context, args, log }) => value`,
        instead of steps.
      selector:
        text:
          multiline: true
    args:
      name: Arguments
      description: Values for the script (`args`) and the steps (`value_arg`); never logged.
      selector:
        object:
    tab:
      name: Tab
      description: A tab (page ID) of the session to run in; by default a new tab, closed afterwards.
      selector:
        text:
    keep_open:
      name: Keep Tab Open
      description: Leave the run's tab open; its ID is returned as `page`.
      selector:
        boolean:
    persistent:
      name: Keep Session
      description: A session the run starts stays when the run ends (until its idle timeout).
      selector:
        boolean:
    timeout:
      name: Timeout
      description: The whole run.
      default: 60
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: seconds
    action_timeout:
      name: Action Timeout
      description: Each Playwright action (click, fill, wait).
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: seconds
    screenshot_on_error:
      name: Screenshot on Error
      description: Return a screenshot (base64 PNG) of the tab when the run fails.
      default: false
      selector:
        boolean:
    fail_on_error:
      name: Fail on Error
      description: Make the action fail when the run fails; otherwise the answer has `ok` false.
      default: true
      selector:
        boolean:
    idle_timeout_minutes:
      name: Idle Timeout
      description: For a session the run starts, minutes without use before it stops.
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: minutes
    node:
      name: Node
      description: Send the run to this mesh node.
      selector:
        text:
