name: test
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
env:
  RUST_BACKTRACE: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build both browser packages
        run: python3 browser/build.py
      - name: Check JavaScript and permission boundaries
        run: |
          for script in browser/extension/*.js assets/extension.js
          do
            node --check "$script"
          done
          node --test browser/check.mjs
          python3 browser/check_companion.py
      - name: Verify pinned signed packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Nix package fetches these from the release: check the pinned hashes
          # and the payloads against the pinned tag's source.
          version=$(jq -r .version browser/packages/metadata.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --depth=1 origin "refs/tags/v$version:refs/tags/v$version"
          previous=$(mktemp -d)
          signed=$(mktemp -d)
          trap 'rm -rf "$previous" "$signed"' EXIT
          gh release download "v$version" --dir "$signed" --pattern 'browser-daemon-node-*'
          echo "$(jq -r .firefoxSha256 browser/packages/metadata.json)  $signed/browser-daemon-node-firefox-$version.xpi" | sha256sum --check
          echo "$(jq -r .chromiumSha256 browser/packages/metadata.json)  $signed/browser-daemon-node-chromium-$version.crx" | sha256sum --check
          mv "$signed/browser-daemon-node-firefox-$version.xpi" "$signed/browser-daemon-node-firefox.xpi"
          mv "$signed/browser-daemon-node-chromium-$version.crx" "$signed/browser-daemon-node-chromium.crx"
          git archive "v$version" | tar -x -C "$previous"
          python3 "$previous/browser/build.py"
          python3 "$previous/browser/verify.py" --signed-directory "$signed"
      - name: Lint Firefox extension
        run: npx --yes web-ext@8 lint --source-dir browser/dist/firefox --warnings-as-errors
  # Real browsers against the real daemon: the extension, its live views and the
  # Firefox companion. Browsers come from nixpkgs (cached store), the daemon from cargo.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-browsers-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-browsers-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      - name: Build the daemon and the extension packages
        run: |
          cargo build --locked
          python3 browser/build.py
      - name: Chromium extension round trip
        run: nix shell --inputs-from . 'nixpkgs#chromium' -c node browser/smoke_chromium.mjs
      - name: Live views of a shared browser
        run: |
          BROWSER_DAEMON_EXTENSION_DIR="$(nix build --no-link --print-out-paths .#rbw-extension)" \
            nix shell --inputs-from . 'nixpkgs#chromium' -c node browser/smoke_handoff.mjs
      - name: Shared media audio and owner revocation
        run: nix shell --inputs-from . 'nixpkgs#chromium' -c node browser/smoke_audio.mjs
      - name: Playwright against a shared browser
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/playwright" playwright-core
          PLAYWRIGHT_DIR="$RUNNER_TEMP/playwright" nix shell --inputs-from . 'nixpkgs#chromium' -c node browser/smoke_playwright.mjs
      - name: Firefox companion with real trusted input
        run: nix shell --inputs-from . 'nixpkgs#firefox' -c python3 browser/smoke_firefox.py
      - name: Firefox extension and native messaging round trip
        run: nix shell --inputs-from . 'nixpkgs#firefox' -c python3 browser/smoke_firefox_roundtrip.py
      - name: Firefox extension without the native companion
        run: nix shell --inputs-from . 'nixpkgs#firefox' -c python3 browser/smoke_firefox_roundtrip.py --dom-only
