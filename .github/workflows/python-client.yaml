name: python-client
# Publishes the Python client (python/) to PyPI once the daemon's release exists
# (the client has the daemon's version; test.yaml tests it). PyPI's trusted
# publisher is bound to this file's name and to the `pypi` environment: there is no
# token, and a job of another workflow file (release.yaml) is refused. The
# environment only deploys from version tags, so this runs on the tag, not after the
# release workflow: it waits for the release to appear.
on:
  # Runs on the tag itself: the `pypi` environment only deploys from version tags.
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    environment:
      name: pypi
      url: https://pypi.org/project/browser-daemon-client/
    permissions:
      # Trusted publishing: the job's OIDC token is PyPI's proof of who publishes.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the release
        run: |
          for _ in $(seq 60); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "::error::no release for $TAG after 30 minutes"; exit 1
      - name: Match tag and package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml | head -n1)
          test "$TAG" = "v$version" || { echo "::error::$TAG does not match python/pyproject.toml's $version"; exit 1; }
      - name: Build
        run: pipx run build --outdir dist python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
