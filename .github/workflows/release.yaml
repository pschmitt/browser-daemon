name: release
on:
  push:
    tags: ['v*']
  # (Re)publish an existing tag with this workflow, e.g. one older than it.
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (vX.Y.Z)
        required: true
      latest:
        description: Mark it as the latest release
        type: boolean
        default: false
      dry-run:
        description: Only check that the tag's signed packages match its source
        type: boolean
        default: false
env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  LC_ALL: C
  TZ: UTC
  TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    name: build (${{ matrix.target }})
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Match tag and package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test "$TAG" = "v$version" || { echo "::error::$TAG does not match Cargo.toml's $version"; exit 1; }
      - name: Set reproducible build environment
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=." >> "$GITHUB_ENV"
      - name: Install musl build dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: TARGET_CC=clang-18 TARGET_AR=llvm-ar-18 cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Build
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          set -o pipefail
          pkg="browser-daemon-${TAG#v}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/browser-daemon"
          mkdir "$pkg"
          cp "$bin" LICENSE README.md "$pkg/"
          # Completions, from releases that have the subcommand.
          if "./$bin" completions bash > /dev/null 2>&1
          then
            mkdir -p "$pkg/completions/bash" "$pkg/completions/zsh" "$pkg/completions/fish"
            "./$bin" completions bash > "$pkg/completions/bash/browser-daemon"
            "./$bin" completions zsh > "$pkg/completions/zsh/_browser-daemon"
            "./$bin" completions fish > "$pkg/completions/fish/browser-daemon.fish"
          fi
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner -cf - "$pkg" |
            gzip -n -9 > "$pkg.tar.gz"
          gzip -t "$pkg.tar.gz"
          # Listed to a file: grep -q quitting early would break tar's pipe (pipefail).
          tar -tzf "$pkg.tar.gz" > "$pkg.contents"
          grep -Fqx "$pkg/browser-daemon" "$pkg.contents"
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.target }}
          path: browser-daemon-*.tar.gz
          if-no-files-found: error
  # The browser extension of the tagged source: the checked-in signed packages
  # when they match it, else (version tags only) signed here, as in rbw: AMO
  # (unlisted) for Firefox, the CRX key for Chromium. AMO signs each version
  # once: after a later job fails, rerun only the failed jobs.
  # AMO signs a version only once: a rerun reuses the tag's release assets.
  browser:
    uses: pschmitt/ci-workflows/.github/workflows/sign-extension.yaml@main
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      firefox-asset: browser-daemon-node-firefox-{version}.xpi
      chromium-asset: browser-daemon-node-chromium-{version}.crx
      sign: ${{ github.event_name == 'push' }}
    secrets:
      amo_api_key: ${{ secrets.BROWSER_NODE_AMO_API_KEY }}
      amo_api_secret: ${{ secrets.BROWSER_NODE_AMO_API_SECRET }}
      chromium_signing_key: ${{ secrets.BROWSER_NODE_CHROMIUM_SIGNING_KEY }}
  release:
    needs: [build, browser]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The notes come from main's changelog (a tag older than it has none).
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-extensions
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ github.workspace }}/dist/*
      - name: Prepare release notes
        run: |
          version="${TAG#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          make_latest: ${{ github.event_name == 'push' || inputs.latest }}
  # The Nix package fetches the signed packages from the release by hash.
  packages:
    needs: [release]
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: pschmitt/ci-workflows/.github/workflows/pin-release.yaml@main
    with:
      tag: ${{ github.ref_name }}
      firefox-asset: browser-daemon-node-firefox-{version}.xpi
      chromium-asset: browser-daemon-node-chromium-{version}.crx
