name: build
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
env:
  RUST_BACKTRACE: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Unsigned packages for temporary loading (Firefox about:debugging, Chromium
  # "Load unpacked" after unzipping). Releases ship the checked-in signed ones.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build unsigned browser packages
        run: python3 browser/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: browser-node-extensions
          path: browser/dist/*.zip
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: actions/upload-artifact@v7
        with:
          name: browser-daemon-x86_64-linux-debug
          path: target/debug/browser-daemon
          if-no-files-found: error
  # aarch64-linux packages and checks, built natively on GitHub's arm runners
  # (nixbot on x86_64 would have to emulate them) and pushed to the niks3 S3 cache;
  # see pschmitt/ci-workflows. rbw-extension only re-exports rbw's own build.
  nix-aarch64:
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-aarch64.yaml@main
    with:
      exclude: '["rbw-extension"]'
      pin-prefix: gh-browser-daemon-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
