[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-daemon-client"
version = "0.15.6"
description = "Async client for browser-daemon: Playwright runs over HTTP, sessions and logins, with nothing but aiohttp"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/pschmitt/browser-daemon"
Documentation = "https://github.com/pschmitt/browser-daemon/blob/main/docs/run.md"

[tool.setuptools]
packages = ["browser_daemon_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
