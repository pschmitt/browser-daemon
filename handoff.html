<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Browser Handoff</title>
<link rel="icon" type="image/svg+xml" href="/handoff/favicon.svg">
<link rel="alternate icon" type="image/x-icon" href="/handoff/favicon.ico">
<style>
  :root { --bg: #0b0d12; --bar: #11141c; --fg: #e8eaf2; --muted: #98a0b8; --line: #262b38; --accent: #7c6cf0; --ok: #10b981; --bad: #e11d48; --btn: #1b2030; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5fa; --bar: #ffffff; --fg: #141725; --muted: #6b7189; --line: #dfe2ec; --btn: #eceef6; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top); }

  /* tab strip */
  #tabStrip { display: flex; align-items: center; gap: 4px; padding: 4px 6px 0; background: color-mix(in oklab, var(--bar) 75%, var(--bg)); border-bottom: 1px solid var(--line); flex: none; min-height: 38px; }
  #tabsScroll { display: flex; align-items: flex-end; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  #tabsScroll::-webkit-scrollbar { display: none; }
  .tab-strip-item { height: 33px; padding: 0 8px 0 10px; border-radius: 9px 9px 0 0; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; border: 1px solid transparent; border-bottom: 0; background: transparent; transition: background .15s, color .15s; max-width: 200px; flex: none; text-decoration: none; user-select: none; }
  .tab-strip-item:hover { background: color-mix(in oklab, var(--bar) 75%, var(--btn)); color: var(--fg); }
  .tab-strip-item.active { background: var(--bar); color: var(--fg); font-weight: 600; border-color: var(--line); border-bottom: 1px solid var(--bar); margin-bottom: -1px; }
  .tab-strip-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tab-strip-tag { font-size: 9.5px; font-weight: 700; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: var(--btn); color: var(--muted); flex: none; }
  .tab-strip-close { width: 18px; height: 18px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; padding: 0; margin-left: 2px; flex: none; }
  .tab-strip-close:hover { background: color-mix(in oklab, var(--bad) 25%, transparent); color: var(--bad); }
  .tab-strip-add { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; margin-bottom: 3px; }
  .tab-strip-add:hover { background: var(--btn); color: var(--fg); }
  .tab-strip-add svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .tab-strip-drawer { height: 30px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; flex: none; margin-bottom: 3px; margin-left: auto; }
  .tab-strip-drawer:hover { background: var(--btn); color: var(--fg); }
  .tab-strip-drawer svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab-strip-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--btn); color: var(--fg); font-size: 10.5px; font-weight: 700; }

  /* top bar & omnibox */
  #bar { display: flex; align-items: center; gap: 2px; padding: 4px 6px; background: var(--bar); border-bottom: 1px solid var(--line); flex: none; }
  .ib { width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 12px;
    background: transparent; color: var(--fg); cursor: pointer; text-decoration: none; }
  .ib:hover { background: var(--btn); }
  .ib:active { background: var(--btn); }
  .ib[disabled] { opacity: .35; }
  .ib[hidden] { display: none; }
  .ib.on { background: color-mix(in oklab, var(--accent) 22%, transparent); color: var(--accent); }
  .ib svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #urlBar { flex: 1; min-width: 0; height: 36px; margin: 0 4px; padding: 0 6px 0 12px; display: flex; align-items: center; gap: 8px;
    border-radius: 999px; background: var(--btn); border: 1px solid transparent; transition: background .15s, border-color .15s, box-shadow .15s; }
  #urlBar:hover { background: color-mix(in oklab, var(--btn) 85%, var(--accent)); }
  #urlBar:focus-within { background: var(--bar); border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 25%, transparent); }
  #urlInput { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--fg); font: 13.5px system-ui, -apple-system, sans-serif; outline: none; padding: 0; -webkit-user-select: text; user-select: text; }
  #urlClear { width: 20px; height: 20px; flex: none; display: none; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: bold; padding: 0; }
  #urlClear:hover { background: var(--line); color: var(--fg); }
  #urlGo { width: 26px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: var(--accent); color: #fff; cursor: pointer; padding: 0; }
  #urlGo:hover { opacity: .9; }
  #urlGo svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  #urlCancel { display: none; background: transparent; border: 0; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 6px; flex: none; -webkit-tap-highlight-color: transparent; }
  #dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--muted); }
  #dot.live { background: var(--ok); }
  #dot.bad { background: var(--bad); }
  .rec-pill { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; margin: 0 4px; border-radius: 999px;
    border: 1px solid color-mix(in oklab, var(--bad) 45%, transparent); background: color-mix(in oklab, var(--bad) 14%, transparent);
    color: var(--bad); font: 700 11.5px system-ui, sans-serif; letter-spacing: .04em; cursor: pointer; font-variant-numeric: tabular-nums; }
  .rec-pill[hidden] { display: none; }
  .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); animation: pulse 1.4s infinite; }
  .rec-pill.paused { color: var(--muted); border-color: var(--line); background: var(--btn); }
  .rec-pill.paused .rec-dot { background: var(--muted); animation: none; border-radius: 1px; width: 7px; box-shadow: none; }
  #sessMenu { position: fixed; z-index: 60; top: 56px; right: 8px; width: 272px; max-width: calc(100vw - 16px); padding: 6px;
    background: var(--bar); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,.4); }
  #sessMenu[hidden] { display: none; }
  #clipToast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); z-index: 80; padding: 7px 14px; border-radius: 99px;
    background: var(--bar); border: 1px solid var(--line); color: var(--fg); font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
  #view:focus { outline: none; }
  #capture.on { color: var(--accent); }
  #stage.dropping::after { content: "Drop to send to the page"; position: absolute; inset: 10px; display: grid; place-items: center; z-index: 30;
    border: 2px dashed var(--accent); border-radius: 14px; background: rgba(124, 108, 240, .14); color: var(--fg); font-weight: 700; font-size: 15px; pointer-events: none; }
  #clipToast.show { opacity: 1; transform: translate(-50%, 0); }
  .sm-narrow { display: none; }
  @media (max-width: 640px) {
    #fwd, #reload, #capture { display: none; }
    .sm-narrow { display: flex; }
    .rec-pill { padding: 0; width: 28px; justify-content: center; margin: 0 2px; }
    #recPillText { display: none; }
  }
  #sessMenu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
  .sm-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 2px; font-weight: 700; font-size: 14px; }
  .sm-engine { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--btn); color: var(--muted); }
  .sm-status { padding: 0 10px 8px; font-size: 12px; color: var(--muted); }
  .sm-rec { display: flex; gap: 6px; padding: 2px 4px; }
  .sm-rec button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--btn); color: var(--fg); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .sm-rec button:hover { border-color: var(--muted); }
  .sm-rec button.rec { color: var(--bad); }
  .sm-rec svg, .sm-item svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sm-rec svg.fill { fill: currentColor; stroke: none; }
  .sm-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent;
    color: var(--fg); font: 500 13.5px system-ui, sans-serif; text-decoration: none; cursor: pointer; text-align: left; }
  .sm-item:hover { background: var(--btn); }
  .sm-search select { margin-left: auto; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--btn); color: inherit; font: inherit; }
  .sm-item:disabled { opacity: .4; }
  .sm-navrow { gap: 4px; }
  .sm-item.danger { color: var(--bad); }
  .sm-item.danger.armed { background: var(--bad); color: #fff; }
  #dot.wait { background: #d97706; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  @media (max-width: 640px) {
    #bar.url-focused .ib, #bar:has(#urlBar:focus-within) .ib { display: none !important; }
    #bar.url-focused #urlCancel, #bar:has(#urlBar:focus-within) #urlCancel { display: inline-block !important; }
    #bar.url-focused #urlBar, #bar:has(#urlBar:focus-within) #urlBar { margin: 0 !important; flex: 1 1 100% !important; width: 100% !important; }
  }

  /* stage */
  #stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
  canvas { flex: none; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; display: block; background: #fff; }
  #stage.fixed { align-items: center; justify-content: center; }
  #stage.fixed canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
  #ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: color-mix(in oklab, var(--accent) 45%, transparent); border: 2px solid var(--accent); }
  #ripple.go { animation: ripple .45s ease-out; }
  @keyframes ripple { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(1.5); } }
  #overlay { position: absolute; inset: 0; display: none; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: color-mix(in oklab, var(--bg) 82%, transparent); backdrop-filter: blur(6px); }
  #overlay.show { display: flex; }
  #overlay p { margin: 0; color: var(--muted); max-width: 28ch; }
  .spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn { padding: 12px 20px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; }

  /* keyboard helper row */
  #keys { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: none; gap: 6px; padding: 6px 8px; background: var(--bar); border-top: 1px solid var(--line); overflow-x: auto; }
  #keys.show { display: flex; }
  #keys button { flex: none; min-width: 52px; height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--btn); color: var(--fg); font-size: 14px; font-weight: 600; }
  #keys button.primary { background: var(--accent); color: #fff; margin-left: auto; }
  #bottom { flex: none; height: env(safe-area-inset-bottom); background: var(--bar); }

  /* the local input that raises the phone's native keyboard */
  #kb { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; padding: 0; border: 0; opacity: 0; font-size: 16px; /* >=16px: no iOS zoom */
    color: transparent; background: transparent; caret-color: transparent; -webkit-user-select: text; user-select: text; }

  /* page picker */
  #list { width: 100%; max-width: 560px; margin: 0 auto; padding: 14px; overflow: auto; align-self: flex-start; }
  #list h1 { font-size: 17px; margin: 4px 2px 12px; }
  #list button { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bar); color: var(--fg); font-size: 15px; }
  #list small { display: block; margin-top: 2px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* tabs modal */
  #tabCountBadge { position: absolute; font-size: 10px; font-weight: 700; color: currentColor; line-height: 1; pointer-events: none; }
  .tabs-modal-overlay { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end; justify-content: center;
    background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px); }
  .tabs-modal-overlay.open { display: flex; }
  @media (min-width: 640px) {
    .tabs-modal-overlay { align-items: center; }
  }
  .tabs-modal-card { width: 100%; max-width: 580px; max-height: 85vh; background: var(--bar); border: 1px solid var(--line);
    border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
  @media (min-width: 640px) {
    .tabs-modal-card { border-radius: 18px; }
  }
  .tabs-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); flex: none; }
  .tabs-list { overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .tab-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--bg); cursor: pointer; transition: border-color .15s, background .15s; }
  .tab-card:hover { border-color: var(--accent); background: color-mix(in oklab, var(--bg) 80%, var(--btn)); }
  .tab-card.active { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, var(--bg)); }
  .tab-info { flex: 1; min-width: 0; }
  .tab-title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-url { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .tab-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .tab-tag { font-size: 10.5px; font-weight: 600; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: var(--btn); color: var(--muted); }
  .tab-tag.current { background: var(--accent); color: #fff; }
  .tab-close { width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
  .tab-close:hover { background: var(--line); color: var(--bad); }
  .btn-xs { padding: 6px 12px; border-radius: 999px; border: 0; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn-close { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.15); color: #ef4444; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
  .btn-close:hover { background: #ef4444; color: #fff; border-color: #ef4444; }
</style>
</head>
<body>
<div id="tabStrip">
  <div id="tabsScroll"></div>
  <button class="tab-strip-add" id="tabAddBtn" title="New Tab" aria-label="New Tab">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="tab-strip-drawer" id="tabsDrawerBtn" title="Switch Tabs &amp; Sessions" aria-label="Tabs">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="2.5"/><path d="M8 8h11a2.5 2.5 0 0 1 2.5 2.5v10.5"/></svg>
    <span class="tab-strip-badge" id="tabCountBadge">1</span>
  </button>
</div>
<div id="bar">
  <a href="/" class="ib" id="dash" aria-label="Dashboard" title="Return to Dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></a>
  <button class="ib" id="back" aria-label="Back" disabled title="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="ib" id="fwd" aria-label="Forward" disabled title="Forward"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button class="ib" id="reload" aria-label="Reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button>
  <form id="urlBar" autocomplete="off">
    <span id="dot" class="wait" title="Connection status"></span>
    <input id="urlInput" type="text" placeholder="Search or enter URL…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="button" id="urlClear" title="Clear URL" aria-label="Clear">✕</button>
    <button type="submit" id="urlGo" title="Navigate" aria-label="Navigate"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <button type="button" id="urlCancel" title="Cancel" aria-label="Cancel">Cancel</button>
  </form>
  <button class="ib" id="capture" aria-label="Capture keyboard" title="Capture keyboard and mouse (fullscreen; hold Esc to release)" hidden><svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
  <button class="ib" id="layout" aria-label="Mobile layout" title="Mobile layout"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg></button>
  <button class="rec-pill" id="recPill" hidden title="Recording controls"><span class="rec-dot"></span><span id="recPillText">REC</span></button>
  <button class="ib" id="kbbtn" aria-label="Keyboard" title="Keyboard"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
  <button class="ib" id="sessBtn" aria-label="Session" title="Session: recording, stop" aria-haspopup="menu" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button>
</div>
<div id="sessMenu" role="menu" hidden>
  <div class="sm-head"><span class="sm-engine" id="smEngine"></span><span id="smTitle">Session</span></div>
  <div class="sm-status" id="smStatus"></div>
  <div class="sm-rec" id="smRec"></div>
  <hr>
  <div class="sm-narrow sm-navrow">
    <button class="sm-item" id="smFwd"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>Forward</button>
    <button class="sm-item" id="smReload"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>Reload</button>
  </div>
  <label class="sm-item sm-search" id="smProxyRow" hidden><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>Proxy<select id="smProxy" aria-label="Proxy"></select></label>
  <label class="sm-item sm-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search with<select id="smSearch" aria-label="Search engine"></select></label>
  <a class="sm-item" href="/"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>Back to dashboard</a>
  <button class="sm-item danger" id="smStop"><svg viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0"/></svg><span id="smStopText">Stop session</span></button>
</div>
<div id="stage">
  <canvas id="view" tabindex="-1"></canvas>
  <div id="ripple"></div>
  <div id="overlay">
    <div class="spin" id="spin"></div>
    <p id="msg">Connecting to the browser…</p>
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="btn" id="retry" hidden>Reconnect</button>
      <a href="/" class="btn" id="overlayDash" style="text-decoration:none;background:var(--btn);color:var(--fg);" hidden>Dashboard</a>
    </div>
  </div>
  <div id="keys">
    <button data-key="Tab">Tab</button>
    <button data-key="Escape">Esc</button>
    <button id="copy" title="Copy selection from remote browser">Copy</button>
    <button id="paste" title="Paste clipboard text to remote browser">Paste</button>
    <button data-key="Enter" class="primary">Enter</button>
  </div>
</div>
<div id="bottom"></div>
<input id="kb" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1">
<div id="tabsModal" class="tabs-modal-overlay">
  <div class="tabs-modal-card">
    <div class="tabs-modal-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;"><rect x="3" y="3" width="13" height="13" rx="2.5"/><path d="M8 8h11a2.5 2.5 0 0 1 2.5 2.5v10.5"/></svg>
        <span style="font-weight:700;font-size:16px;">Tabs &amp; Sessions</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn-xs" id="newTabBtn" title="Open new tab in this browser">+ New Tab</button>
        <button class="btn-close" id="closeTabsBtn" title="Close">✕</button>
      </div>
    </div>
    <div id="tabsList" class="tabs-list"></div>
  </div>
</div>
<script>
"use strict";
/* __CLUSTER_SECRET_PLACEHOLDER__ */
function authHeaders(extra = {}) {
  const h = { ...extra };
  if (typeof window !== 'undefined' && window.__CLUSTER_SECRET__) {
    h['Authorization'] = 'Bearer ' + window.__CLUSTER_SECRET__;
    h['X-Browser-Cluster-Secret'] = window.__CLUSTER_SECRET__;
  }
  return h;
}

const params = new URLSearchParams(location.search);
const pageId = params.get("page");
const testHost = params.get("host");               // testing only: talk to another Browserless
const $ = (id) => document.getElementById(id);
const E = {
  smSearch: $("smSearch"),
  tabStrip: $("tabStrip"), tabsScroll: $("tabsScroll"), tabAddBtn: $("tabAddBtn"), tabsDrawerBtn: $("tabsDrawerBtn"), tabCountBadge: $("tabCountBadge"),
  bar: $("bar"), stage: $("stage"), view: $("view"), ripple: $("ripple"), overlay: $("overlay"), msg: $("msg"), spin: $("spin"), retry: $("retry"), overlayDash: $("overlayDash"),
  dot: $("dot"), urlBar: $("urlBar"), urlInput: $("urlInput"), urlClear: $("urlClear"), urlGo: $("urlGo"), urlCancel: $("urlCancel"),
  tabsModal: $("tabsModal"), tabsList: $("tabsList"), newTabBtn: $("newTabBtn"), closeTabsBtn: $("closeTabsBtn"),
  capture: $("capture"),
  kb: $("kb"), keys: $("keys"), dash: $("dash"), back: $("back"), fwd: $("fwd"), reload: $("reload"), layout: $("layout"), kbbtn: $("kbbtn"),
  sessBtn: $("sessBtn"), sessMenu: $("sessMenu"), recPill: $("recPill")
};
const ctx = E.view.getContext("2d", { alpha: false, desynchronized: true }) || E.view.getContext("2d");

/* ---------------------------------------------------------------- drivers */
// The UI talks to a driver; CdpDriver serves Chromium, BidiDriver serves Firefox.
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

class Cdp {
  constructor(url, handlers) {
    this.handlers = handlers; this.id = 0; this.pending = new Map(); this.ws = new WebSocket(url);
    this.ready = new Promise((res, rej) => { this.ws.onopen = res; this.ws.onerror = () => rej(new Error("connection failed")); });
    this.ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.id) {
        const p = this.pending.get(m.id); if (!p) return; this.pending.delete(m.id);
        m.error ? p.rej(new Error(m.error.message)) : p.res(m.result);
      } else if (m.method) this.handlers.event(m.method, m.params);
    };
    this.ws.onclose = () => { for (const p of this.pending.values()) p.rej(new Error("closed")); this.pending.clear(); this.handlers.close(); };
  }
  call(method, params = {}) {
    return new Promise((res, rej) => {
      if (this.ws.readyState !== 1) return rej(new Error("closed"));
      const id = ++this.id; this.pending.set(id, { res, rej });
      this.ws.send(JSON.stringify({ id, method, params }));
    });
  }
  send(method, params) { this.call(method, params).catch(() => {}); }
  close() { try { this.ws.close(); } catch { /* already closed */ } }
}

const CDP_KEYS = {
  Enter: [13, "\r"], Tab: [9], Backspace: [8], Escape: [27], Delete: [46],
  ArrowLeft: [37], ArrowUp: [38], ArrowRight: [39], ArrowDown: [40], Home: [36], End: [35], PageUp: [33], PageDown: [34],
};

class CdpDriver {
  constructor(url, h) {
    this.h = h;
    this.cdp = new Cdp(url, { event: (m, p) => this.onEvent(m, p), close: () => h.close(this) });
    this.ready = this.cdp.ready;
  }
  isOpen() { return this.cdp.ws.readyState === WebSocket.OPEN || this.cdp.ws.readyState === WebSocket.CONNECTING; }
  close() { this.cdp.close(); }
  async start() { await this.cdp.call("Page.enable"); }
  async applyMetrics({ w, h, dpr, mobile }) {
    // Cap the screencast scale factor (4K JPEG encoding on CPU is slow).
    const scale = Math.min(dpr, 1.25);
    if (mobile) {
      await this.cdp.call("Emulation.setDeviceMetricsOverride", { width: w, height: h, deviceScaleFactor: Math.min(dpr, 2), mobile: true, screenWidth: w, screenHeight: h });
      await this.cdp.call("Emulation.setTouchEmulationEnabled", { enabled: true, maxTouchPoints: 5 }).catch(() => {});
    } else {
      await this.cdp.call("Emulation.clearDeviceMetricsOverride").catch(() => {});
      await this.cdp.call("Emulation.setTouchEmulationEnabled", { enabled: false }).catch(() => {});
    }
    await this.cdp.call("Page.stopScreencast").catch(() => {});
    await this.cdp.call("Page.startScreencast", {
      format: "jpeg", quality: 65, everyNthFrame: 1,
      maxWidth: Math.min(Math.round(w * scale), 1600), maxHeight: Math.min(Math.round(h * scale), 1000),
    });
  }
  onEvent(method, p) {
    const h = this.h;
    if (method === "Page.screencastFrame") {
      // ACK after drawing: keeps 1:1 pacing instead of queueing frames.
      h.frame(p.data, p.metadata).finally(() => this.cdp.send("Page.screencastFrameAck", { sessionId: p.sessionId }));
    } else if (method === "Page.frameStartedLoading" || method === "Page.frameStartedNavigating") {
      h.loading();
    } else if (method === "Page.frameNavigated" && !p.frame.parentId) {
      h.navigated(p.frame.url);
    } else if (method === "Page.loadEventFired" || method === "Page.navigatedWithinDocument" || method === "Page.frameStoppedLoading") {
      h.loaded();
    } else if (method === "Page.javascriptDialogOpening") {
      h.dialog({ type: p.type, message: p.message, defaultValue: p.defaultPrompt })
        .then(({ accept, text }) => this.cdp.send("Page.handleJavaScriptDialog", { accept, promptText: text }));
    } else if (method === "Inspector.detached" || method === "Target.targetCrashed") {
      h.gone("The page was closed");
    }
  }
  async evaluate(expression) {
    const r = await this.cdp.call("Runtime.evaluate", { expression, returnByValue: true });
    return r && r.result ? r.result.value : undefined;
  }
  click(x, y, touch) {
    if (touch) {
      this.cdp.send("Input.dispatchTouchEvent", { type: "touchStart", touchPoints: [{ x, y }] });
      this.cdp.send("Input.dispatchTouchEvent", { type: "touchEnd", touchPoints: [] });
    }
    this.cdp.send("Input.dispatchMouseEvent", { type: "mouseMoved", x, y });
    this.cdp.send("Input.dispatchMouseEvent", { type: "mousePressed", x, y, button: "left", clickCount: 1 });
    this.cdp.send("Input.dispatchMouseEvent", { type: "mouseReleased", x, y, button: "left", clickCount: 1 });
  }
  wheel(x, y, dx, dy) { this.cdp.send("Input.dispatchMouseEvent", { type: "mouseWheel", x, y, deltaX: dx, deltaY: dy }); }
  insertText(text) { this.cdp.send("Input.insertText", { text }); }
  // Desktop mouse: real presses and drags, so text can be selected.
  mouseDown(x, y, clickCount) {
    this.cdp.send("Input.dispatchMouseEvent", { type: "mouseMoved", x, y });
    this.cdp.send("Input.dispatchMouseEvent", { type: "mousePressed", x, y, button: "left", buttons: 1, clickCount });
  }
  mouseMove(x, y, down) { this.cdp.send("Input.dispatchMouseEvent", { type: "mouseMoved", x, y, button: down ? "left" : "none", buttons: down ? 1 : 0 }); }
  mouseUp(x, y, clickCount) { this.cdp.send("Input.dispatchMouseEvent", { type: "mouseReleased", x, y, button: "left", buttons: 0, clickCount }); }
  // Drop local files (paths on the browser's host) onto the page, like a desktop drag.
  async dropFiles(x, y, files) {
    const data = { items: [], files, dragOperationsMask: 1 };
    for (const type of ["dragEnter", "dragOver", "drop"]) await this.cdp.call("Input.dispatchDragEvent", { type, x, y, data });
  }
  // Ctrl/Cmd shortcut; `command` makes headless Chromium run the editing command.
  shortcut(key, shift, command) {
    const code = "Key" + key.toUpperCase(), vk = key.toUpperCase().charCodeAt(0);
    const base = { modifiers: 2 | (shift ? 8 : 0), key, code, windowsVirtualKeyCode: vk, nativeVirtualKeyCode: vk };
    this.cdp.send("Input.dispatchKeyEvent", { type: "rawKeyDown", ...base, commands: command ? [command] : [] });
    this.cdp.send("Input.dispatchKeyEvent", { type: "keyUp", ...base });
  }
  pressKey(key) {
    const [vk, text] = CDP_KEYS[key];
    this.cdp.send("Input.dispatchKeyEvent", { type: text ? "keyDown" : "rawKeyDown", key, code: key, windowsVirtualKeyCode: vk, nativeVirtualKeyCode: vk, text });
    this.cdp.send("Input.dispatchKeyEvent", { type: "keyUp", key, code: key, windowsVirtualKeyCode: vk, nativeVirtualKeyCode: vk });
  }
  async navigate(url) {
    const res = await this.cdp.call("Page.navigate", { url });
    if (res && res.errorText) throw new Error(res.errorText);
  }
  reload() { this.cdp.send("Page.reload"); }
  async history(delta) {
    const h = await this.cdp.call("Page.getNavigationHistory");
    const e = h.entries[h.currentIndex + delta];
    if (e) this.cdp.send("Page.navigateToHistoryEntry", { entryId: e.id });
  }
  async historyState() {
    const h = await this.cdp.call("Page.getNavigationHistory");
    return h && h.entries ? { back: h.currentIndex > 0, fwd: h.currentIndex < h.entries.length - 1 } : null;
  }
}

// WebDriver key codes for the special keys the UI sends.
const BIDI_KEYS = {
  Enter: "\uE007", Tab: "\uE004", Backspace: "\uE003", Escape: "\uE00C", Delete: "\uE017",
  ArrowLeft: "\uE012", ArrowUp: "\uE013", ArrowRight: "\uE014", ArrowDown: "\uE015", Home: "\uE011", End: "\uE010", PageUp: "\uE00E", PageDown: "\uE00F",
};
const BIDI_EVENTS = [
  "browsingContext.navigationStarted", "browsingContext.load", "browsingContext.domContentLoaded",
  "browsingContext.fragmentNavigated", "browsingContext.historyUpdated", "browsingContext.contextDestroyed",
  "browsingContext.userPromptOpened",
];

// Firefox has no screencast: poll JPEG screenshots, faster right after input or changes.
class BidiDriver {
  constructor(url, context, h) {
    this.h = h; this.ctx = context; this.id = 0; this.pending = new Map();
    this.vp = { w: 1280, h: 800 }; this.lastFrame = ""; this.interval = 60; this.lastMeasure = 0;
    this.ws = new WebSocket(url);
    this.ws.onmessage = (ev) => this.onMessage(JSON.parse(ev.data));
    this.ws.onclose = () => { for (const p of this.pending.values()) p.rej(new Error("closed")); this.pending.clear(); h.close(this); };
    this.ready = new Promise((res, rej) => { this.ws.onopen = res; this.ws.onerror = () => rej(new Error("connection failed")); })
      .then(() => this.rpc("session.new", { capabilities: {} }));
  }
  isOpen() { return this.ws.readyState === WebSocket.OPEN || this.ws.readyState === WebSocket.CONNECTING; }
  close() { try { this.ws.close(); } catch { /* already closed */ } }
  rpc(method, params = {}) {
    return new Promise((res, rej) => {
      if (this.ws.readyState !== 1) return rej(new Error("closed"));
      const id = ++this.id; this.pending.set(id, { res, rej });
      this.ws.send(JSON.stringify({ id, method, params }));
    });
  }
  send(method, params) { this.rpc(method, params).catch(() => {}); }
  onMessage(m) {
    if (m.type === "event") return this.onEvent(m.method, m.params || {});
    const p = this.pending.get(m.id); if (!p) return; this.pending.delete(m.id);
    m.type === "success" ? p.res(m.result) : p.rej(new Error(m.message || m.error || "error"));
  }
  onEvent(method, p) {
    if (p.context && p.context !== this.ctx) return;
    const h = this.h;
    this.kick();
    if (method === "browsingContext.navigationStarted") h.loading();
    else if (method === "browsingContext.contextDestroyed") h.gone("The tab was closed");
    else if (method === "browsingContext.userPromptOpened") {
      h.dialog({ type: p.type, message: p.message, defaultValue: p.defaultValue })
        .then(({ accept, text }) => this.send("browsingContext.handleUserPrompt", { context: this.ctx, accept, userText: text }));
    } else {
      if (p.url) h.navigated(p.url);
      if (method !== "browsingContext.domContentLoaded") { this.measure(); h.loaded(); }
    }
  }
  async start() {
    await this.rpc("session.subscribe", { events: BIDI_EVENTS, contexts: [this.ctx] });
    await this.rpc("browsingContext.activate", { context: this.ctx }).catch(() => {});
    await this.measure();
    this.loop();
  }
  async measure() {
    try {
      const [w, h] = await this.evaluate("[innerWidth, innerHeight]");
      if (w > 0 && h > 0) this.vp = { w, h };
      this.lastMeasure = performance.now();
    } catch { /* navigating */ }
  }
  kick() { this.interval = 60; }
  async loop() {
    while (this.ws.readyState === WebSocket.OPEN) {
      if (document.visibilityState !== "visible") { await sleep(400); continue; }
      const t0 = performance.now();
      try {
        if (t0 - this.lastMeasure > 2000) await this.measure();
        const r = await this.rpc("browsingContext.captureScreenshot", {
          context: this.ctx, origin: "viewport", format: { type: "image/jpeg", quality: 0.65 },
        });
        if (r.data !== this.lastFrame) {
          this.lastFrame = r.data;
          this.interval = 60;
          await this.h.frame(r.data, { deviceWidth: this.vp.w, deviceHeight: this.vp.h, pageScaleFactor: 1, offsetTop: 0 });
        } else {
          this.interval = Math.min(this.interval * 1.5, 400);   // idle page: back off
        }
      } catch { await sleep(300); }
      const wait = this.interval - (performance.now() - t0);
      if (wait > 0) await sleep(wait);
    }
  }
  async applyMetrics({ w, h, dpr, mobile }) {
    await this.rpc("browsingContext.setViewport", mobile
      ? { context: this.ctx, viewport: { width: w, height: h }, devicePixelRatio: Math.min(dpr, 2) }
      : { context: this.ctx, viewport: null, devicePixelRatio: null });
    await this.measure();
    this.kick();
  }
  async evaluate(expression) {
    const r = await this.rpc("script.evaluate", {
      expression: `JSON.stringify(${expression})`, target: { context: this.ctx }, awaitPromise: false, userActivation: true,
    });
    if (r.type === "exception") throw new Error(r.exceptionDetails?.text || "exception");
    return r.result && r.result.type === "string" ? JSON.parse(r.result.value) : undefined;
  }
  actions(actions) { this.kick(); this.send("input.performActions", { context: this.ctx, actions }); }
  click(x, y, touch) {
    x = Math.round(x); y = Math.round(y);
    this.actions([{ type: "pointer", id: touch ? "touch" : "mouse", parameters: { pointerType: touch ? "touch" : "mouse" }, actions: [
      { type: "pointerMove", x, y }, { type: "pointerDown", button: 0 }, { type: "pointerUp", button: 0 },
    ] }]);
  }
  wheel(x, y, dx, dy) {
    this.actions([{ type: "wheel", id: "wheel", actions: [
      { type: "scroll", x: Math.round(x), y: Math.round(y), deltaX: Math.round(dx), deltaY: Math.round(dy) },
    ] }]);
  }
  insertText(text) {
    // Real key events for typing; long pastes go through execCommand (one input event).
    const chars = [...text];
    if (chars.length <= 32) {
      this.actions([{ type: "key", id: "kbd", actions: chars.flatMap((c) => [{ type: "keyDown", value: c }, { type: "keyUp", value: c }]) }]);
      return;
    }
    this.evaluate(`(() => { let a = document.activeElement; while (a && a.shadowRoot && a.shadowRoot.activeElement) a = a.shadowRoot.activeElement;
      return document.execCommand("insertText", false, ${JSON.stringify(text)}); })()`)
      .then((ok) => { if (!ok) this.actions([{ type: "key", id: "kbd", actions: chars.flatMap((c) => [{ type: "keyDown", value: c }, { type: "keyUp", value: c }]) }]); })
      .catch(() => {});
  }
  mouseDown(x, y) { this.pointer([{ type: "pointerMove", x: Math.round(x), y: Math.round(y) }, { type: "pointerDown", button: 0 }]); }
  mouseMove(x, y) { this.pointer([{ type: "pointerMove", x: Math.round(x), y: Math.round(y) }]); }
  mouseUp(x, y) { this.pointer([{ type: "pointerMove", x: Math.round(x), y: Math.round(y) }, { type: "pointerUp", button: 0 }]); }
  async dropFiles() { throw new Error("Dropping files needs a Chromium session"); }
  pointer(actions) { this.actions([{ type: "pointer", id: "mouse", parameters: { pointerType: "mouse" }, actions }]); }
  shortcut(key, shift) {
    const mods = shift ? ["\uE009", "\uE008"] : ["\uE009"];
    this.actions([{ type: "key", id: "kbd", actions: [
      ...mods.map((value) => ({ type: "keyDown", value })), { type: "keyDown", value: key }, { type: "keyUp", value: key },
      ...mods.reverse().map((value) => ({ type: "keyUp", value })),
    ] }]);
  }
  pressKey(key) {
    const v = BIDI_KEYS[key];
    this.actions([{ type: "key", id: "kbd", actions: [{ type: "keyDown", value: v }, { type: "keyUp", value: v }] }]);
  }
  async navigate(url) { this.kick(); await this.rpc("browsingContext.navigate", { context: this.ctx, url, wait: "none" }); }
  // History restores from the back/forward cache fire no load event: re-read the URL.
  resyncSoon() { for (const ms of [400, 1500]) setTimeout(() => this.h.loaded(), ms); }
  reload() { this.kick(); this.send("browsingContext.reload", { context: this.ctx, wait: "none" }); }
  async history(delta) {
    this.kick();
    await this.rpc("browsingContext.traverseHistory", { context: this.ctx, delta }).catch(() => {});
    this.resyncSoon();
  }
  async historyState() { return null; }   // BiDi exposes no history list: keep both buttons enabled
}

/* ---------------------------------------------------------------- state */
let drv = null, target = null, meta = { deviceWidth: 1280, deviceHeight: 800 }, currentUrl = "";
let mobileLayout = (localStorage.getItem("handoff.mobile") ?? (matchMedia("(pointer: coarse)").matches ? "1" : "0")) === "1";
let refitting = false, manualKb = false, mirror = "", composing = false, resyncTimer = null, probeSeq = 0;

function setState(kind, text) {
  E.dot.className = kind === "live" ? "live" : kind === "bad" ? "bad" : "wait";
  const show = kind !== "live";
  E.overlay.classList.toggle("show", show);
  E.spin.hidden = kind === "bad";
  E.retry.hidden = kind !== "bad";
  if (E.overlayDash) E.overlayDash.hidden = kind !== "bad";
  if (show) E.msg.textContent = kind === "bad" ? (text || "Disconnected") : "Connecting to the browser…";
}

/* ---------------------------------------------------------------- connecting */
async function fetchTargets() {
  const list = await (await fetch("/json/list", { headers: authHeaders() })).json();
  return list.filter((x) => x.type === "page");
}

const handlers = {
  frame: (data, m) => drawFrame(data, m),
  loading: () => { E.dot.className = "wait"; },
  navigated: (url) => {
    if (url && url !== "about:blank") {
      currentUrl = url;
      if (document.activeElement !== E.urlInput) E.urlInput.value = currentUrl;
    }
    refreshInfo();
  },
  loaded: () => {
    E.dot.className = "live";
    refreshInfo();
    if (mobileLayout && target && target.engine !== "firefox") applyMetrics();
  },
  dialog: async ({ type, message, defaultValue }) => {
    if (type === "prompt") {
      const text = window.prompt(message, defaultValue || "");
      return { accept: text !== null, text: text ?? undefined };
    }
    if (type === "alert") { window.alert(message); return { accept: true }; }
    return { accept: window.confirm(message || "Leave this page?") };
  },
  gone: (why) => setState("bad", stopping ? "Session stopped" : why),
  close: (d) => {
    if (d !== drv) return;   // a replaced driver shutting down
    setState("bad", "The browser session ended");
    if (document.visibilityState === "visible") setTimeout(autoReconnect, 1500);
  },
};

let connecting = false;
async function connect() {
  if (connecting) return;
  connecting = true;
  if (drv) drv.close();
  setState("wait", "Connecting to the browser…");
  try {
    target = (await fetchTargets()).find((t) => t.id === pageId) || null;
    if (!target) { setState("bad", "This tab no longer exists"); return; }
    const scheme = testHost || location.protocol === "https:" ? "wss://" : "ws://";
    const host = testHost || location.host;
    drv = target.engine === "firefox"
      ? new BidiDriver(`${scheme}${host}/firefox?session_id=${encodeURIComponent(target.sessionId)}&observer=true`, pageId, handlers)
      : new CdpDriver(`${scheme}${host}/devtools/page/${encodeURIComponent(pageId)}?observer=true`, handlers);
    document.body.dataset.engine = target.engine || "chromium";
    await drv.ready;
    await drv.start();
    await applyMetrics();
    setState("live");
    refreshInfo();
    startSessionPolling();
    loadTabs();
  } catch (e) {
    setState("bad", "Could not connect (" + e.message + ")");
    if (document.visibilityState === "visible") setTimeout(autoReconnect, 2500);
  } finally {
    connecting = false;
  }
}

// The remote page gets the size of this screen (like a real phone) or its own desktop size.
async function applyMetrics() {
  if (!drv) return;
  const r = E.stage.getBoundingClientRect();
  const w = Math.max(200, Math.floor(r.width)), h = Math.max(200, Math.floor(r.height));
  await drv.applyMetrics({ w, h, dpr: devicePixelRatio || 1, mobile: mobileLayout });
  E.layout.classList.toggle("on", mobileLayout);
}

function sizeCanvas() {
  E.stage.classList.toggle("fixed", mobileLayout);
  if (mobileLayout && meta.deviceWidth > 0 && meta.deviceHeight > 0) {
    const stageRect = E.stage.getBoundingClientRect();
    if (stageRect.width > 0 && Math.abs(stageRect.width - meta.deviceWidth) < 25) {
      E.view.style.width = meta.deviceWidth + "px";
      E.view.style.height = meta.deviceHeight + "px";
    } else {
      E.view.style.width = "";
      E.view.style.height = "";
    }
  } else {
    E.view.style.width = "";
    E.view.style.height = "";
  }
}

function base64ToBlob(b64, mime = "image/jpeg") {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

let lastBitmap = null;

async function drawFrame(data, frameMeta) {
  try {
    meta = frameMeta;
    let img;
    if (typeof createImageBitmap === "function") {
      img = await createImageBitmap(base64ToBlob(data));   // decoded off the main thread
    } else {
      img = await new Promise((resolve, reject) => {
        const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = "data:image/jpeg;base64," + data;
      });
    }
    if (refitting && Math.abs(meta.deviceWidth - fitSize.w) < 8 && Math.abs(meta.deviceHeight - fitSize.h) < 8) refitting = false;
    if (E.view.width !== img.width || E.view.height !== img.height) { E.view.width = img.width; E.view.height = img.height; }
    sizeCanvas();
    ctx.drawImage(img, 0, 0);
    if (lastBitmap) lastBitmap.close();
    lastBitmap = img.close ? img : null;
  } catch { /* ignore frame decode errors */ }
}

async function refreshInfo() {
  if (!drv) return;
  try {
    const info = await drv.evaluate("({ u: location.href, t: document.title })");
    if (info) {
      if (info.u && info.u !== "about:blank") currentUrl = info.u;
      if (document.activeElement !== E.urlInput && currentUrl) E.urlInput.value = currentUrl;
      document.title = (info.t ? info.t + " · " : "") + "Browser handoff";
    }
    const h = await drv.historyState();
    E.back.disabled = h ? !h.back : false;
    E.fwd.disabled = h ? !h.fwd : false;
    loadTabs();
  } catch { /* page navigating */ }
}

/* ---------------------------------------------------------------- touch: tap = click, drag = scroll */
function toPage(e) {
  const r = E.view.getBoundingClientRect();
  const s = Math.min(r.width / E.view.width, r.height / E.view.height);
  const dw = E.view.width * s, dh = E.view.height * s;
  const ox = r.left + (r.width - dw) / 2, oy = r.top + (r.height - dh) / 2;
  const fx = (e.clientX - ox) / dw, fy = (e.clientY - oy) / dh;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return null;
  const psf = meta.pageScaleFactor || 1;
  const offY = meta.offsetTop || 0;
  return {
    x: (fx * meta.deviceWidth) / psf,
    y: (fy * meta.deviceHeight - offY) / psf,
    scale: (meta.deviceHeight / dh) / psf
  };
}

// Is the element at (x, y) of the remote page a text field (or a label for one)?
function hitExpr(x, y) {
  return `(() => {
    let d = document, x = ${x}, y = ${y}, el = null;
    for (let i = 0; i < 6; i++) {
      el = d.elementFromPoint(x, y);
      if (!el) return false;
      if (el.shadowRoot) { const s = el.shadowRoot.elementFromPoint(x, y); if (s) el = s; }
      if ((el.tagName === "IFRAME" || el.tagName === "FRAME") && el.contentDocument) {
        const r = el.getBoundingClientRect(); x -= r.left; y -= r.top; d = el.contentDocument; continue;
      }
      break;
    }
    const f = el.closest("input, textarea, label, [contenteditable]");
    if (!f) return false;
    if (f.tagName === "LABEL") return !!(f.control && f.control.matches("input, textarea"));
    const non = ["button","submit","checkbox","radio","range","color","file","image","reset","hidden"];
    return f.tagName === "TEXTAREA" || f.isContentEditable || !non.includes((f.type || "").toLowerCase());
  })()`;
}

let pendingWheel = null;
let wheelRaf = false;

function queueWheel(x, y, dx, dy) {
  if (!drv) return;
  if (!pendingWheel) {
    pendingWheel = { x, y, dx: 0, dy: 0 };
  }
  pendingWheel.x = x;
  pendingWheel.y = y;
  pendingWheel.dx += dx;
  pendingWheel.dy += dy;
  if (!wheelRaf) {
    wheelRaf = true;
    requestAnimationFrame(flushWheel);
  }
}

function flushWheel() {
  wheelRaf = false;
  if (!pendingWheel || !drv) return;
  const { x, y, dx, dy } = pendingWheel;
  pendingWheel = null;
  if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
    drv.wheel(x, y, dx, dy);
  }
}

let touch = null;
// A mouse drives the remote mouse directly (drag selects text, double-click selects a word);
// touch keeps tap = click and drag = scroll.
let mouse = null, lastDown = { t: 0, x: 0, y: 0, n: 0 };
E.view.addEventListener("pointerdown", (e) => {
  if (!e.isPrimary) return;
  if (e.pointerType === "mouse") {
    if (e.button !== 0 || !drv || refitting) return;
    const p = toPage(e);
    if (!p) return;
    E.view.setPointerCapture(e.pointerId);
    E.view.focus({ preventScroll: true });
    // pointerdown carries no click count: count double and triple clicks here.
    const now = performance.now();
    const again = now - lastDown.t < 450 && Math.hypot(e.clientX - lastDown.x, e.clientY - lastDown.y) < 6;
    lastDown = { t: now, x: e.clientX, y: e.clientY, n: again ? Math.min(lastDown.n + 1, 3) : 1 };
    mouse = { clicks: lastDown.n };
    drv.mouseDown(Math.round(p.x), Math.round(p.y), mouse.clicks);
    return;
  }
  E.view.setPointerCapture(e.pointerId);
  const t = touch = { x: e.clientX, y: e.clientY, lastY: e.clientY, moved: false, t: performance.now(), editable: false };
  // Is there a text field under the finger? Asked now, so the answer is in by the time the finger lifts.
  const p = toPage(e);
  if (p && drv) drv.evaluate(hitExpr(p.x, p.y)).then((v) => { t.editable = v === true; }).catch(() => {});
});
let moveRaf = 0, lastMove = null;
E.view.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") {
    if (!mouse || !drv) return;   // hover moves are not forwarded: they would flood the socket
    lastMove = toPage(e);
    if (!moveRaf) moveRaf = requestAnimationFrame(() => {
      moveRaf = 0;
      if (lastMove && mouse && drv) drv.mouseMove(Math.round(lastMove.x), Math.round(lastMove.y), true);
    });
    return;
  }
  if (!touch || !e.isPrimary) return;
  if (!touch.moved && Math.hypot(e.clientX - touch.x, e.clientY - touch.y) > 9) touch.moved = true;
  if (touch.moved) {
    const p = toPage(e);
    if (p) queueWheel(p.x, p.y, 0, (touch.lastY - e.clientY) * p.scale);
    touch.lastY = e.clientY;
  }
});
E.view.addEventListener("pointerup", (e) => {
  if (e.pointerType === "mouse") {
    if (!mouse || !drv) return;
    const p = toPage(e), clicks = mouse.clicks;
    mouse = null;
    if (p) drv.mouseUp(Math.round(p.x), Math.round(p.y), clicks);
    // No probeFocus here: with a physical keyboard, keys go straight to the page, and the
    // probe would collapse a selection just made inside a text field.
    refreshRemoteSelection();
    return;
  }
  if (!touch || !e.isPrimary) return;
  const wasTap = !touch.moved;
  const editable = touch.editable;
  touch = null;
  flushWheel();
  if (!wasTap || refitting) return;       // the picture is about to change size: a tap would land wrong
  const p = toPage(e);
  if (!p) return;
  // Raise the keyboard synchronously, inside the user gesture (phones only allow it there), but
  // only when the hit test saw a text field: raising and lowering it again on every other tap
  // resized the whole view each time. If the answer came in late, probeFocus() still raises it.
  if (editable) E.kb.focus({ preventScroll: true });
  tapFeedback(e.clientX, e.clientY);
  const px = Math.round(p.x), py = Math.round(p.y);
  drv.click(px, py, mobileLayout);
  setTimeout(probeFocus, 160);
});
E.view.addEventListener("pointercancel", () => { touch = null; mouse = null; flushWheel(); });
E.view.addEventListener("wheel", (e) => {
  e.preventDefault();
  const p = toPage(e);
  if (!p) return;
  let dx = e.deltaX, dy = e.deltaY;
  if (e.deltaMode === 1) { dx *= 33; dy *= 33; }
  else if (e.deltaMode === 2) { dx *= 100; dy *= 100; }
  queueWheel(p.x, p.y, dx * p.scale, dy * p.scale);
}, { passive: false });
E.view.addEventListener("contextmenu", (e) => e.preventDefault());

function tapFeedback(x, y) {
  const r = E.stage.getBoundingClientRect();
  E.ripple.style.left = x - r.left + "px"; E.ripple.style.top = y - r.top + "px";
  E.ripple.classList.remove("go"); void E.ripple.offsetWidth; E.ripple.classList.add("go");
  navigator.vibrate?.(8);
}

/* ---------------------------------------------------------------- native keyboard */
// What is focused in the remote page? Text field -> mirror it into the local hidden input.
const PROBE = `(() => {
  let a = document.activeElement;
  for (let i = 0; a && i < 8; i++) {
    if (a.shadowRoot && a.shadowRoot.activeElement) a = a.shadowRoot.activeElement;
    else if (a.tagName === "IFRAME" || a.tagName === "FRAME") {
      try { const d = a.contentDocument; if (d && d.activeElement && d.activeElement !== d.body) a = d.activeElement; else break; }
      catch (e) { return { editable: false, frame: true }; }
    } else break;
  }
  if (!a || a === document.body) return { editable: false };
  const tag = (a.tagName || "").toLowerCase(), type = (a.type || "").toLowerCase();
  const non = ["button","submit","checkbox","radio","range","color","file","image","reset","hidden"];
  const editable = tag === "textarea" || (tag === "input" && !non.includes(type)) || a.isContentEditable;
  if (!editable) return { editable: false };
  const value = a.value !== undefined ? a.value : a.textContent || "";
  try { a.setSelectionRange(value.length, value.length); } catch (e) {}
  return { editable: true, tag, type: type || "text", value, inputmode: a.inputMode || "", enter: a.enterKeyHint || "", ro: !!(a.readOnly || a.disabled), ac: a.autocomplete || "" };
})()`;

async function probeFocus() {
  const my = ++probeSeq;
  let info;
  try { info = await drv.evaluate(PROBE); } catch { return; }
  if (my !== probeSeq) return;
  if (info && info.editable && !info.ro) {
    showKeyboard(info);
  } else if (!manualKb) {
    E.kb.blur();
    E.keys.classList.remove("show");
  }
}

// Input types whose native keyboard we mirror; anything else (number, date, ...) gets the text one.
const KB_TYPES = new Set(["email", "tel", "url", "search", "password"]);
function showKeyboard(info) {
  const kb = E.kb;
  const type = KB_TYPES.has(info.type) ? info.type : "text";
  if (kb.type !== type) kb.type = type;
  kb.inputMode = info.inputmode || (info.type === "number" ? "decimal" : "");
  kb.enterKeyHint = info.enter || (info.tag === "textarea" ? "enter" : "go");
  kb.setAttribute("autocomplete", type === "password" ? "current-password" : "off");
  if (kb.value !== info.value) kb.value = info.value;
  mirror = kb.value;
  if (document.activeElement !== kb) kb.focus({ preventScroll: true });
  try { kb.setSelectionRange(kb.value.length, kb.value.length); } catch { /* types without selection */ }
  E.keys.classList.add("show");
}

// Forward what is typed: diff against the mirror (handles autocorrect/swipe typing/IME).
E.kb.addEventListener("input", () => {
  const now = E.kb.value;
  let p = 0; const max = Math.min(mirror.length, now.length);
  while (p < max && mirror[p] === now[p]) p++;
  for (let i = mirror.length - p; i > 0; i--) pressKey("Backspace");
  const added = now.slice(p);
  if (added) drv.insertText(added);
  mirror = now;
  clearTimeout(resyncTimer);
  if (!composing) resyncTimer = setTimeout(resync, 350);
});
E.kb.addEventListener("compositionstart", () => { composing = true; });
E.kb.addEventListener("compositionend", () => { composing = false; clearTimeout(resyncTimer); resyncTimer = setTimeout(resync, 350); });
// The remote field may reformat or limit input (maxlength, masks): follow it.
async function resync() {
  try {
    const info = await drv.evaluate(PROBE);
    if (info && info.editable && info.value !== E.kb.value && !composing) { E.kb.value = info.value; mirror = info.value; }
  } catch { /* ignore */ }
}
E.kb.addEventListener("keydown", (e) => {
  // Editing shortcuts act on the remote field; the mirror follows (select all) or resyncs.
  if ((e.ctrlKey || e.metaKey) && !e.altKey && drv) {
    const k = e.key.toLowerCase();
    if (k === "a" || k === "z" || k === "y") {
      e.preventDefault();
      const redo = k === "y" || (k === "z" && e.shiftKey);
      drv.shortcut(k, e.shiftKey, k === "a" ? "selectAll" : redo ? "redo" : "undo");
      if (k === "a") E.kb.select();
      else { clearTimeout(resyncTimer); resyncTimer = setTimeout(resync, 150); }
      refreshRemoteSelection();
    }
    return;
  }
  if (e.key === "Enter") { e.preventDefault(); pressKey("Enter"); setTimeout(probeFocus, 400); }
  else if (e.key === "Tab") { e.preventDefault(); pressKey("Tab"); setTimeout(probeFocus, 200); }
  else if (e.key === "Escape") { e.preventDefault(); pressKey("Escape"); }
});
E.kb.addEventListener("blur", () => { if (!manualKb) E.keys.classList.remove("show"); });

const KEYS = CDP_KEYS;
function pressKey(key) { if (drv) drv.pressKey(key); }

/* ---------------------------------------------------------------- toolbar & omnibox */
// Virtual keyboard buttons must not take focus from the local input, or the keyboard would close.
for (const b of document.querySelectorAll("#keys button")) {
  b.addEventListener("pointerdown", (e) => e.preventDefault());
}
E.back.onclick = () => navigateHistory(-1);
E.fwd.onclick = () => navigateHistory(1);
E.reload.onclick = () => drv && drv.reload();

const SEARCH_ENGINES = {
  duckduckgo: { name: "DuckDuckGo", url: "https://duckduckgo.com/?q=" },
  google: { name: "Google", url: "https://www.google.com/search?q=" },
  startpage: { name: "Startpage", url: "https://www.startpage.com/do/search?q=" },
  brave: { name: "Brave Search", url: "https://search.brave.com/search?q=" },
  bing: { name: "Bing", url: "https://www.bing.com/search?q=" },
  kagi: { name: "Kagi", url: "https://kagi.com/search?q=" },
};
// Shared with the handoff view (same origin, same key).
const SEARCH_KEY = "browserd.search";
function searchEngine() {
  let id = null;
  try { id = localStorage.getItem(SEARCH_KEY); } catch { /* storage unavailable */ }
  return { id: SEARCH_ENGINES[id] ? id : "duckduckgo", ...SEARCH_ENGINES[SEARCH_ENGINES[id] ? id : "duckduckgo"] };
}
function setSearchEngine(id) {
  try { localStorage.setItem(SEARCH_KEY, id); } catch { /* storage unavailable */ }
}
function applySearchEngine() {
  const se = searchEngine();
  E.urlInput.placeholder = `Search ${se.name} or enter URL…`;
  E.smSearch.value = se.id;
}
E.smSearch.innerHTML = Object.entries(SEARCH_ENGINES).map(([id, e]) => `<option value="${id}">${e.name}</option>`).join("");
E.smSearch.onchange = () => { setSearchEngine(E.smSearch.value); applySearchEngine(); };
addEventListener("storage", (e) => { if (e.key === SEARCH_KEY) applySearchEngine(); });
applySearchEngine();

function normalizeUrl(input) {
  let val = (input || "").trim();
  if (!val) return "about:blank";
  if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(val)) return val;
  if (val.includes(".") && !val.includes(" ")) {
    return "https://" + val;
  } else if (val.startsWith("localhost")) {
    return "http://" + val;
  }
  return searchEngine().url + encodeURIComponent(val);
}

E.urlInput.onfocus = () => {
  E.bar.classList.add("url-focused");
  E.urlInput.select();
  E.urlClear.style.display = E.urlInput.value ? "flex" : "none";
  if (manualKb) {
    manualKb = false;
    E.kbbtn.classList.remove("on");
    E.keys.classList.remove("show");
  }
};

function dismissUrlBar() {
  E.bar.classList.remove("url-focused");
  E.urlInput.value = currentUrl || "";
  E.urlClear.style.display = "none";
  E.urlInput.blur();
}

E.urlCancel.onclick = (e) => {
  e.preventDefault();
  dismissUrlBar();
};

E.urlInput.oninput = () => {
  E.urlClear.style.display = E.urlInput.value ? "flex" : "none";
};

E.urlInput.onblur = () => {
  setTimeout(() => {
    if (document.activeElement !== E.urlInput) {
      E.bar.classList.remove("url-focused");
      E.urlClear.style.display = "none";
      if (!E.urlInput.value && currentUrl) E.urlInput.value = currentUrl;
    }
  }, 180);
};

E.urlClear.onclick = (e) => {
  e.preventDefault();
  e.stopPropagation();
  E.urlInput.value = "";
  E.urlInput.focus();
  E.urlClear.style.display = "none";
};

E.urlInput.onkeydown = (e) => {
  if (e.key === "Escape") {
    e.preventDefault();
    dismissUrlBar();
  }
};

E.urlBar.onsubmit = async (e) => {
  e.preventDefault();
  const val = E.urlInput.value.trim();
  if (!val) return;
  const dest = normalizeUrl(val);
  E.urlInput.value = dest;
  E.bar.classList.remove("url-focused");
  E.urlInput.blur();
  E.dot.className = "wait";

  if (drv) {
    try {
      await drv.navigate(dest);
    } catch (err) {
      alert("Failed to navigate: " + err.message);
      E.dot.className = "bad";
    }
  }
};

/* ---------------------------------------------------------------- tabs & sessions */
// Opens a blank tab and focuses its URL bar, like a browser's new-tab button.
async function openNewTab() {
  try {
    const qs = new URLSearchParams();
    qs.set("url", "about:blank");
    if (pageId) qs.set("page", pageId);
    const res = await fetch("/json/new?" + qs.toString(), {
      method: "PUT",
      headers: authHeaders()
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || res.statusText);
    }
    const target = await res.json();
    if (target && target.id) {
      const u = new URL(location.href);
      u.searchParams.set("page", target.id);
      u.searchParams.set("newtab", "1");
      location.href = u.toString();
      return;
    }
    throw new Error("Invalid response from /json/new");
  } catch (err) {
    alert("Failed to create new tab: " + err.message);
  }
}

async function closeTab(id) {
  const isCurrent = id === pageId;
  if (isCurrent && !confirm("Close the current tab?")) return;
  try {
    const res = await fetch("/json/close/" + encodeURIComponent(id), {
      method: "PUT",
      headers: authHeaders()
    });
    if (!res.ok) throw new Error("Close request failed");
    if (isCurrent) {
      const list = await (await fetch("/json/list", { headers: authHeaders() })).json();
      const pages = list.filter((p) => p.type === "page" && p.id !== id);
      const u = new URL(location.href);
      if (pages.length > 0) {
        u.searchParams.set("page", pages[0].id);
      } else {
        u.searchParams.delete("page");
      }
      location.href = u.toString();
    } else {
      loadTabs();
    }
  } catch (err) {
    alert("Failed to close tab: " + err.message);
  }
}

async function loadTabs() {
  try {
    const list = await (await fetch("/json/list", { headers: authHeaders() })).json();
    const pages = list.filter((x) => x.type === "page");
    if (E.tabCountBadge) E.tabCountBadge.textContent = pages.length || 1;
    renderTabStrip(pages);
    renderTabsModal(pages);
  } catch { /* ignore */ }
}

function renderTabStrip(pages) {
  if (!E.tabsScroll) return;
  E.tabsScroll.innerHTML = "";
  for (const p of pages) {
    const isCurrent = p.id === pageId;
    const item = document.createElement("a");
    item.className = "tab-strip-item" + (isCurrent ? " active" : "");
    const itemUrl = new URL(location.href);
    itemUrl.searchParams.set("page", p.id);
    item.href = itemUrl.toString();
    item.onclick = (e) => {
      e.preventDefault();
      if (!isCurrent) {
        location.href = itemUrl.toString();
      }
    };

    let iconHost = "";
    if (p.url) {
      try { iconHost = new URL(p.url, location.href).hostname; } catch {}
    }

    const iconWrap = document.createElement("span");
    iconWrap.style.display = "inline-flex";
    iconWrap.style.alignItems = "center";
    iconWrap.style.justifyContent = "center";
    iconWrap.style.width = "14px";
    iconWrap.style.height = "14px";
    iconWrap.style.flexShrink = "0";

    if (iconHost && iconHost !== "localhost" && !iconHost.endsWith(".ts.brkn.lol")) {
      const img = document.createElement("img");
      img.src = `https://icons.duckduckgo.com/ip3/${iconHost}.ico`;
      img.style.width = "14px";
      img.style.height = "14px";
      img.style.borderRadius = "2px";
      img.style.objectFit = "contain";
      img.onerror = () => {
        iconWrap.innerHTML = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
      };
      iconWrap.appendChild(img);
    } else {
      iconWrap.innerHTML = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
    }
    item.appendChild(iconWrap);

    const title = document.createElement("span");
    title.className = "tab-strip-title";
    let fallback = "New Tab";
    if (p.url) {
      try { fallback = new URL(p.url, location.href).hostname || p.url; } catch { fallback = p.url; }
    }
    title.textContent = p.title || fallback;
    title.title = p.title ? (p.title + " (" + p.url + ")") : p.url;
    item.appendChild(title);

    if (p.profile) {
      const tag = document.createElement("span");
      tag.className = "tab-strip-tag";
      tag.textContent = p.profile;
      item.appendChild(tag);
    }

    const closeBtn = document.createElement("button");
    closeBtn.className = "tab-strip-close";
    closeBtn.innerHTML = "✕";
    closeBtn.title = "Close tab";
    closeBtn.setAttribute("aria-label", "Close tab");
    closeBtn.onclick = (e) => {
      e.stopPropagation();
      e.preventDefault();
      closeTab(p.id);
    };
    item.appendChild(closeBtn);

    E.tabsScroll.appendChild(item);
  }
}

function renderTabsModal(pages) {
  if (!E.tabsModal.classList.contains("open")) return;
  if (pages.length === 0) {
    E.tabsList.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:13.5px;">No open tabs found.</div>`;
    return;
  }
  E.tabsList.innerHTML = "";
  for (const p of pages) {
    const isCurrent = p.id === pageId;
    const card = document.createElement("div");
    card.className = "tab-card" + (isCurrent ? " active" : "");

    const info = document.createElement("div");
    info.className = "tab-info";

    let iconHost = "";
    if (p.url) {
      try { iconHost = new URL(p.url, location.href).hostname; } catch {}
    }
    const iconImg = iconHost && iconHost !== "localhost" && !iconHost.endsWith(".ts.brkn.lol")
      ? `<img src="https://icons.duckduckgo.com/ip3/${iconHost}.ico" style="width:16px;height:16px;border-radius:3px;vertical-align:middle;margin-right:6px;display:inline-block;" onerror="this.style.display='none'">`
      : `<span style="margin-right:6px;display:inline-block;vertical-align:middle;"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>`;

    const title = document.createElement("div");
    title.className = "tab-title";
    title.innerHTML = `${iconImg}<span>${(p.title || "(untitled)").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>`;

    const url = document.createElement("div");
    url.className = "tab-url";
    url.textContent = p.url || "about:blank";

    const metaWrap = document.createElement("div");
    metaWrap.className = "tab-meta";

    if (isCurrent) {
      const curTag = document.createElement("span");
      curTag.className = "tab-tag current";
      curTag.textContent = "Active";
      metaWrap.appendChild(curTag);
    }

    if (p.profile) {
      const profTag = document.createElement("span");
      profTag.className = "tab-tag";
      profTag.textContent = "Profile: " + p.profile;
      metaWrap.appendChild(profTag);
    } else if (p.sessionId) {
      const sessTag = document.createElement("span");
      sessTag.className = "tab-tag";
      sessTag.textContent = "Session: " + p.sessionId.slice(0, 8);
      metaWrap.appendChild(sessTag);
    }

    info.appendChild(title);
    info.appendChild(url);
    if (metaWrap.children.length > 0) info.appendChild(metaWrap);
    card.appendChild(info);

    const closeBtn = document.createElement("button");
    closeBtn.className = "tab-close";
    closeBtn.title = "Close tab";
    closeBtn.setAttribute("aria-label", "Close tab");
    closeBtn.innerHTML = "✕";
    closeBtn.onclick = (e) => {
      e.stopPropagation();
      closeTab(p.id);
    };
    card.appendChild(closeBtn);

    card.onclick = () => {
      closeTabsModal();
      if (!isCurrent) {
        const u = new URL(location.href);
        u.searchParams.set("page", p.id);
        location.href = u.toString();
      }
    };

    E.tabsList.appendChild(card);
  }
}

async function openTabsModal() {
  if (manualKb) {
    manualKb = false;
    E.kbbtn.classList.remove("on");
    E.keys.classList.remove("show");
  }
  E.tabsModal.classList.add("open");
  loadTabs();
}

function closeTabsModal() {
  E.tabsModal.classList.remove("open");
}

E.tabAddBtn.onclick = () => openNewTab();
E.tabsDrawerBtn.onclick = () => openTabsModal();
E.newTabBtn.onclick = () => openNewTab();
E.closeTabsBtn.onclick = () => closeTabsModal();
E.tabsModal.onclick = (e) => {
  if (e.target === E.tabsModal) closeTabsModal();
};

async function navigateHistory(d) {
  if (drv) await drv.history(d).catch(() => {});
}
E.layout.onclick = async () => {
  mobileLayout = !mobileLayout;
  localStorage.setItem("handoff.mobile", mobileLayout ? "1" : "0");
  await applyMetrics();
  sizeCanvas();
};
E.kbbtn.onclick = () => {
  manualKb = !manualKb;
  E.kbbtn.classList.toggle("on", manualKb);
  if (manualKb) { E.kb.focus({ preventScroll: true }); E.keys.classList.add("show"); probeFocus(); }
  else { E.kb.blur(); E.keys.classList.remove("show"); }
};
document.querySelectorAll("#keys button[data-key]").forEach((b) => b.addEventListener("click", () => { pressKey(b.dataset.key); setTimeout(probeFocus, 300); }));
async function copyRemoteSelection() {
  if (!drv) return '';
  try {
    const text = await drv.evaluate(`(() => {
        let sel = window.getSelection()?.toString() || '';
        if (!sel && document.activeElement) {
          let el = document.activeElement;
          if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            try {
              sel = el.value.substring(el.selectionStart, el.selectionEnd);
            } catch(e) {}
          }
        }
        return sel;
      })()`);
    if (text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      }
      return text;
    }
  } catch(e) {
    console.warn("copyRemoteSelection failed:", e);
  }
  return '';
}

async function pasteToRemote() {
  if (!drv) return;
  try {
    let t = '';
    if (navigator.clipboard && navigator.clipboard.readText) {
      try {
        t = await navigator.clipboard.readText();
      } catch(e) {}
    }
    if (!t) {
      t = prompt("Paste text into browser session:");
    }
    if (t) {
      drv.insertText(t);
    }
  } catch(e) {
    console.warn("pasteToRemote failed:", e);
  }
}

const copyBtn = $("copy");
if (copyBtn) {
  copyBtn.addEventListener("click", async () => {
    const text = await copyRemoteSelection();
    const oldText = copyBtn.textContent;
    copyBtn.textContent = text ? "Copied!" : "No selection";
    setTimeout(() => { copyBtn.textContent = oldText; }, 1200);
  });
}

const pasteBtn = $("paste");
if (pasteBtn) {
  pasteBtn.addEventListener("click", async () => {
    await pasteToRemote();
  });
}
E.retry.onclick = () => connect();

// Re-fit the remote page when the screen really changes (rotation, native keyboard, browser bars).
function keepFocusVisible() {
  if (!E.keys.classList.contains("show")) return;
  drv.evaluate(`(() => { let a = document.activeElement; while (a && a.shadowRoot && a.shadowRoot.activeElement) a = a.shadowRoot.activeElement; if (a && a !== document.body) a.scrollIntoView({ block: "nearest", inline: "nearest" }); })()`).catch(() => {});
}
var fitTimer = null, fitSize = { w: 0, h: 0 };
new ResizeObserver(() => {
  const r = E.stage.getBoundingClientRect();
  if (Math.abs(r.width - fitSize.w) < 10 && Math.abs(r.height - fitSize.h) < 30) return;
  fitSize = { w: r.width, h: r.height };
  if (!drv || !mobileLayout) return;
  refitting = true;                        // until the first frame of the new size arrives
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => applyMetrics().then(keepFocusVisible).catch(() => {}).finally(() => setTimeout(() => { refitting = false; }, 1500)), 250);
}).observe(E.stage);
window.addEventListener("pagehide", () => drv && drv.close());   // also releases the size override

let reconnecting = false;
async function autoReconnect() {
  if (reconnecting || connecting || !pageId) return;
  if (!drv || !drv.isOpen()) {
    reconnecting = true;
    try {
      await connect();
    } catch {
      // ignore, connect handles error state
    } finally {
      reconnecting = false;
    }
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    autoReconnect();
  }
});
window.addEventListener("pageshow", () => {
  autoReconnect();
});
window.addEventListener("focus", () => {
  autoReconnect();
});

// Desktop: type straight into the page. Copy, cut and paste use the browser's own clipboard
// events (no permission prompt): the remote selection is fetched ahead of time, after every
// mouse release or key press, because a copy event has to be answered synchronously.
let remoteSel = "", selTimer = 0;
const SEL_EXPR = `(() => {
  let a = document.activeElement;
  while (a && a.shadowRoot && a.shadowRoot.activeElement) a = a.shadowRoot.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) {
    try { if (a.selectionEnd > a.selectionStart) return a.value.substring(a.selectionStart, a.selectionEnd); } catch (e) {}
  }
  return window.getSelection()?.toString() || "";
})()`;
function refreshRemoteSelection(delay = 120) {
  clearTimeout(selTimer);
  selTimer = setTimeout(() => {
    if (drv) drv.evaluate(SEL_EXPR).then((t) => { remoteSel = t || ""; }).catch(() => {});
  }, delay);
}
const localTyping = () => !drv || document.activeElement === E.kb || document.activeElement === E.urlInput
  || !!document.activeElement?.closest?.("#sessMenu, #tabsModal, dialog");
const SHORTCUTS = { a: "selectAll", z: "undo", y: "redo" };
window.addEventListener("keydown", (e) => {
  if (localTyping()) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey) {
    const k = e.key.toLowerCase();
    // c, x, v: let the native copy/cut/paste events fire (handled below); should the
    // browser skip the event (nothing selected locally), fall back to the async clipboard API.
    if (k === "c" || k === "x" || k === "v") {
      clipEventSeen = false;
      setTimeout(() => {
        if (clipEventSeen || !drv) return;
        if (k === "v") pasteToRemote();
        else copyRemoteSelection().then((t) => {
          toast(t ? (k === "x" ? "Cut" : "Copied") : "Nothing selected");
          if (t && k === "x") drv.evaluate(`document.execCommand("delete")`).catch(() => {});
        });
      }, 60);
      return;
    }
    if (k in SHORTCUTS) {
      e.preventDefault();
      const redo = k === "z" && e.shiftKey;
      drv.shortcut(redo ? "z" : k, e.shiftKey, redo ? "redo" : SHORTCUTS[k]);
      refreshRemoteSelection();
      return;
    }
    // Captured: the page gets Ctrl+T, Ctrl+W, Ctrl+L, … too. Otherwise they stay local.
    if (captured && /^[a-z]$/.test(k)) { e.preventDefault(); drv.shortcut(k, e.shiftKey, null); }
    return;
  }
  if (mod || e.altKey) return;
  if (e.key.length === 1) { drv.insertText(e.key); e.preventDefault(); }
  else if (KEYS[e.key]) { pressKey(e.key); e.preventDefault(); }
  else return;
  refreshRemoteSelection(250);
});
let clipEventSeen = false;
function copyFromRemote(e, cut) {
  if (localTyping()) return;
  clipEventSeen = true;
  e.preventDefault();
  if (remoteSel) {
    e.clipboardData.setData("text/plain", remoteSel);
    toast(cut ? "Cut" : "Copied");
  } else {
    // Nothing cached yet (selection made by a script, say): ask now and write asynchronously.
    copyRemoteSelection().then((t) => toast(t ? (cut ? "Cut" : "Copied") : "Nothing selected"));
  }
  if (cut) drv.evaluate(`document.execCommand("delete")`).catch(() => {}).finally(() => refreshRemoteSelection());
}
window.addEventListener("copy", (e) => copyFromRemote(e, false));
window.addEventListener("cut", (e) => copyFromRemote(e, true));
window.addEventListener("paste", (e) => {
  if (localTyping()) return;
  clipEventSeen = true;
  e.preventDefault();
  const text = e.clipboardData?.getData("text/plain");
  if (text) { drv.insertText(text); refreshRemoteSelection(250); }
  else pasteToRemote();
});
let toastTimer = 0;
function toast(text, ms = 1100) {
  let el = document.getElementById("clipToast");
  if (!el) {
    el = document.createElement("div");
    el.id = "clipToast";
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => el.classList.remove("show"), ms);
}

/* ---------------------------------------------------------------- capture */
// Fullscreen plus the Keyboard Lock API (Chromium): browser shortcuts such as Ctrl+W or
// Ctrl+T reach the remote page, and Esc has to be held to leave. Without Keyboard Lock
// (Firefox, Safari) this is plain fullscreen.
let captured = false;
E.capture.hidden = !document.fullscreenEnabled;
E.capture.onclick = async () => {
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  try {
    await document.documentElement.requestFullscreen({ navigationUI: "hide" });
    if (navigator.keyboard?.lock) {
      await navigator.keyboard.lock();
      captured = true;
    }
    E.capture.classList.add("on");
    E.view.focus({ preventScroll: true });
    toast(captured ? "Keyboard captured: hold Esc to release" : "Fullscreen: press Esc to leave");
  } catch (err) {
    toast("Could not capture: " + err.message);
  }
};
document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) return;
  captured = false;
  navigator.keyboard?.unlock?.();
  E.capture.classList.remove("on");
});

/* ---------------------------------------------------------------- drag & drop files */
// Files dropped on the picture are stored on the browser's host, then dropped onto the
// page at the same spot (file inputs and drop zones both take them).
let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
E.stage.addEventListener("dragenter", (e) => {
