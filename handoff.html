  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  E.stage.classList.add("dropping");
});
E.stage.addEventListener("dragover", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
});
E.stage.addEventListener("dragleave", () => {
  if (--dragDepth <= 0) { dragDepth = 0; E.stage.classList.remove("dropping"); }
});
E.stage.addEventListener("drop", async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  E.stage.classList.remove("dropping");
  const files = [...e.dataTransfer.files];
  const p = toPage(e);
  if (!files.length || !drv || !target?.sessionId) return;
  if (!p) { toast("Drop onto the page"); return; }
  const label = files.length === 1 ? files[0].name : `${files.length} files`;
  try {
    toast(`Sending ${label}…`, 0);
    const paths = [];
    for (const f of files) {
      const res = await fetch(`/api/sessions/${encodeURIComponent(target.sessionId)}/files?name=${encodeURIComponent(f.name)}`,
        { method: "PUT", headers: authHeaders({ "Content-Type": "application/octet-stream" }), body: f });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
      paths.push((await res.json()).path);
    }
    await drv.dropFiles(Math.round(p.x), Math.round(p.y), paths);
    toast(`Dropped ${label}`);
  } catch (err) {
    toast(`Could not drop ${label}: ${err.message}`, 4000);
  }
});

/* ---------------------------------------------------------------- page picker (no ?page=) */
async function pickPage() {
  E.sessBtn.hidden = E.kbbtn.hidden = E.layout.hidden = E.reload.hidden = E.back.hidden = E.fwd.hidden = true;
  if (E.tabStrip) E.tabStrip.hidden = true;
  if (E.urlBar) E.urlBar.hidden = true;
  E.overlay.classList.remove("show");
  E.view.hidden = true;
  const list = await (await fetch("/json/list", { headers: authHeaders() })).json();
  const box = document.createElement("div");
  box.id = "list";
  const pages = list.filter((x) => x.type === "page");
  if (pages.length === 0) {
    box.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h1 style="margin:0;">No active pages</h1>
        <a href="/" style="font-size:13.5px;color:var(--accent);text-decoration:none;font-weight:600;">Dashboard ↗</a>
      </div>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:16px;">There are no open pages in running browser sessions right now.</p>
      <a href="/" class="btn" style="display:inline-block;text-decoration:none;text-align:center;">Go to Dashboard</a>`;
  } else {
    box.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h1 style="margin:0;">Which page?</h1>
        <a href="/" style="font-size:13.5px;color:var(--accent);text-decoration:none;font-weight:600;">Dashboard ↗</a>
      </div>`;
    for (const p of pages) {
      const b = document.createElement("button");
      b.textContent = p.title || "(untitled)";
      const s = document.createElement("small");
      s.textContent = p.url;
      b.appendChild(s);
      b.onclick = () => { location.search = "?page=" + encodeURIComponent(p.id); };
      box.appendChild(b);
    }
  }
  E.stage.appendChild(box);
  E.dot.className = "";
}

/* ---------------------------------------------------------------- session menu: recording + stop */
let sess = null, sessTimer = null, stopArmed = 0, stopping = false;
const ICON = {
  rec: '<svg class="fill" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>',
  pause: '<svg class="fill" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  play: '<svg class="fill" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>',
  stop: '<svg class="fill" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
};
const fmtDur = (s) => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };

async function sessionApi(method, path) {
  const res = await fetch(`/api/sessions/${encodeURIComponent(target.sessionId)}${path}`, { method, headers: authHeaders() });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json().catch(() => ({}));
}

// The node's proxies, for the session menu (not reachable through the public view).
let proxyNames = {};
fetch("/api/proxies", { headers: authHeaders() }).then((r) => (r.ok ? r.json() : []))
  .then((list) => {
    proxyNames = Object.fromEntries(list.map((x) => [x.id, x.name]));
    $("smProxyRow").hidden = !list.length;
    $("smProxy").innerHTML = `<option value="none">Direct</option>` + list.map((x) => `<option value="${x.id}">${x.name.replace(/</g, "&lt;")}</option>`).join("");
    if (sess) $("smProxy").value = sess.proxy || "none";
  }).catch(() => {});
$("smProxy").onchange = async () => {
  const proxy = $("smProxy").value;
  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(target.sessionId)}/proxy`, {
      method: "POST", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify({ proxy }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    toast(proxy === "none" ? "Connecting directly" : `Now via ${proxyNames[proxy] || proxy}`);
    await refreshSession();
    drv?.reload();
  } catch (err) {
    toast("Could not switch: " + err.message, 4000);
    if (sess) $("smProxy").value = sess.proxy || "none";
  }
};

async function refreshSession() {
  if (!target?.sessionId) return;
  try {
    sess = (await sessionApi("GET", "")).session;
    renderSession();
  } catch { /* session gone: the driver reports it */ }
}

function renderSession() {
  if (!sess) return;
  E.sessBtn.hidden = false;
  const rec = sess.is_recording, paused = rec && sess.recording_paused;
  E.recPill.hidden = !rec;
  E.recPill.classList.toggle("paused", paused);
  $("recPillText").textContent = paused ? "PAUSED" : "REC";
  $("smEngine").textContent = sess.engine || "chromium";
  $("smTitle").textContent = sess.profile ? `Profile ${sess.profile}` : sess.persistent ? "Persistent session" : "Throwaway session";
  $("smStatus").textContent = `Up ${fmtDur(sess.uptime_seconds || 0)} · ${sess.tabs_count} tab${sess.tabs_count === 1 ? "" : "s"}`
    + (rec ? (paused ? " · recording paused" : " · recording") : "")
    + (sess.proxy ? ` · via ${proxyNames[sess.proxy] || sess.proxy}` : "");
  if (document.activeElement !== $("smProxy")) $("smProxy").value = sess.proxy || "none";
  const btn = (act, icon, label, cls = "") => `<button data-rec="${act}" class="${cls}">${ICON[icon]}${label}</button>`;
  const html = !rec ? btn("record", "rec", "Start recording", "rec")
    : (paused ? btn("resume-record", "play", "Resume") : btn("pause-record", "pause", "Pause")) + btn("stop-record", "stop", "Stop", "rec");
  const box = $("smRec");
  if (box._html !== html) { box.innerHTML = html; box._html = html; }
}

function toggleSessMenu(open = E.sessMenu.hidden) {
  E.sessMenu.hidden = !open;
  E.sessBtn.classList.toggle("on", open);
  disarmStop();
  if (open) {
    const r = E.sessBtn.getBoundingClientRect();
    E.sessMenu.style.top = (r.bottom + 6) + "px";
    $("smFwd").disabled = E.fwd.disabled;
    refreshSession();
  }
}
function disarmStop() {
  clearTimeout(stopArmed); stopArmed = 0;
  $("smStop").classList.remove("armed");
  $("smStopText").textContent = "Stop session";
}

E.sessBtn.onclick = (e) => { e.stopPropagation(); toggleSessMenu(); };
E.recPill.onclick = (e) => { e.stopPropagation(); toggleSessMenu(true); };
document.addEventListener("pointerdown", (e) => {
  if (!E.sessMenu.hidden && !e.target.closest("#sessMenu, #sessBtn, #recPill")) toggleSessMenu(false);
});
$("smFwd").onclick = () => { toggleSessMenu(false); E.fwd.click(); };
$("smReload").onclick = () => { toggleSessMenu(false); E.reload.click(); };
$("smRec").onclick = async (e) => {
  const b = e.target.closest("[data-rec]");
  if (!b) return;
  b.disabled = true;
  try {
    await sessionApi("POST", "/" + b.dataset.rec);
  } catch (err) {
    $("smStatus").textContent = "Failed: " + err.message;
  }
  await refreshSession();
};
// Two taps (desktop: two clicks) so a stray touch cannot kill the browser.
$("smStop").onclick = async () => {
  if (!stopArmed) {
    $("smStop").classList.add("armed");
    $("smStopText").textContent = sess?.persistent || sess?.profile ? "Tap again to stop (profile is kept)" : "Tap again to stop and discard";
    stopArmed = setTimeout(disarmStop, 4000);
    return;
  }
  disarmStop();
  $("smStopText").textContent = "Stopping…";
  try {
    stopping = true;
    await sessionApi("DELETE", "");
    if (drv) drv.close();
    location.href = "/";
  } catch (err) {
    stopping = false;
    $("smStatus").textContent = "Could not stop: " + err.message;
    $("smStopText").textContent = "Stop session";
  }
};
function startSessionPolling() {
  clearInterval(sessTimer);
  refreshSession();
  sessTimer = setInterval(() => { if (document.visibilityState === "visible") refreshSession(); }, 5000);
}

// ?session=<id> (dashboard launch): open that session's first tab.
async function boot() {
  const sessionId = params.get("session");
  if (!pageId && sessionId) {
    for (let i = 0; i < 20; i++) {
      const page = (await fetchTargets().catch(() => [])).find((t) => t.sessionId === sessionId);
      if (page) {
        const u = new URL(location.href);
        u.searchParams.delete("session");
        u.searchParams.set("page", page.id);
        location.replace(u.toString());
        return;
      }
      await sleep(500);
    }
  }
  if (params.has("newtab")) {
    const u = new URL(location.href);
    u.searchParams.delete("newtab");
    history.replaceState(null, "", u.toString());
    E.urlInput.value = "";
    E.urlInput.focus();
  }
  if (pageId) connect();
  else pickPage().catch((e) => setState("bad", String(e)));
}
boot();
</script>
