<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Browser Handoff</title>
<link rel="icon" type="image/svg+xml" href="/handoff/favicon.svg">
<link rel="alternate icon" type="image/x-icon" href="/handoff/favicon.ico">
<style>
  :root { --bg: #0b0d12; --bar: #11141c; --fg: #e8eaf2; --muted: #98a0b8; --line: #262b38; --accent: #7c6cf0; --ok: #10b981; --bad: #e11d48; --btn: #1b2030; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5fa; --bar: #ffffff; --fg: #141725; --muted: #6b7189; --line: #dfe2ec; --btn: #eceef6; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top); }

  /* tab strip */
  #tabStrip { touch-action: manipulation; user-select: none; display: flex; align-items: center; gap: 4px; padding: 4px 6px 0; background: color-mix(in oklab, var(--bar) 75%, var(--bg)); border-bottom: 1px solid var(--line); flex: none; min-height: 38px; }
  #tabsScroll { display: flex; align-items: flex-end; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  #tabsScroll::-webkit-scrollbar { display: none; }
  .tab-strip-item { height: 33px; padding: 0 8px 0 10px; border-radius: 9px 9px 0 0; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; border: 1px solid transparent; border-bottom: 0; background: transparent; transition: background .15s, color .15s; flex: 0 1 220px; min-width: 96px; max-width: 240px; overflow: hidden; text-decoration: none; user-select: none; }
  .tab-strip-item:hover { background: color-mix(in oklab, var(--bar) 75%, var(--btn)); color: var(--fg); }
  .tab-strip-item.active { background: var(--bar); color: var(--fg); font-weight: 600; border-color: var(--line); border-bottom: 1px solid var(--bar); margin-bottom: -1px; }
  .tab-strip-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  /* Playing sound, like a desktop browser's tab speaker. */
  .audible { display: inline-flex; flex: none; color: var(--accent, currentColor); margin-right: 4px; vertical-align: -2px; }
  .audible svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab-strip-close { width: 20px; height: 20px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; padding: 0; margin-left: 2px; flex: none; }
  .tab-strip-close:hover { background: color-mix(in oklab, var(--bad) 25%, transparent); color: var(--bad); }
  .tab-strip-add { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; margin-bottom: 3px; }
  .tab-strip-add:hover { background: var(--btn); color: var(--fg); }
  .tab-strip-add svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .tab-strip-drawer { height: 30px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; flex: none; margin-bottom: 3px; margin-left: auto; }
  .tab-strip-drawer:hover { background: var(--btn); color: var(--fg); }
  .tab-strip-drawer svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab-strip-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--btn); color: var(--fg); font-size: 10.5px; font-weight: 700; }

  /* top bar & omnibox */
  #bar { display: flex; align-items: center; gap: 2px; padding: 4px 6px; background: var(--bar); border-bottom: 1px solid var(--line); flex: none; }
  .ib { width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 12px;
    background: transparent; color: var(--fg); cursor: pointer; text-decoration: none; }
  .ib:hover { background: var(--btn); }
  .ib:active { background: var(--btn); }
  .ib[disabled] { opacity: .35; }
  .ib[hidden] { display: none; }
  .ib.on { background: color-mix(in oklab, var(--accent) 22%, transparent); color: var(--accent); }
  .ib svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #urlBar { flex: 1; min-width: 0; height: 36px; margin: 0 4px; padding: 0 6px 0 12px; display: flex; align-items: center; gap: 8px;
    border-radius: 999px; background: var(--btn); border: 1px solid transparent; transition: background .15s, border-color .15s, box-shadow .15s; }
  #urlBar:hover { background: color-mix(in oklab, var(--btn) 85%, var(--accent)); }
  #urlBar:focus-within { background: var(--bar); border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 25%, transparent); }
  #urlInput { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--fg); font: 13.5px system-ui, -apple-system, sans-serif; outline: none; padding: 0; -webkit-user-select: text; user-select: text; }
  #urlClear { width: 20px; height: 20px; flex: none; display: none; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: bold; padding: 0; }
  #urlClear:hover { background: var(--line); color: var(--fg); }
  #urlGo { width: 26px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: var(--accent); color: #fff; cursor: pointer; padding: 0; }
  #urlGo:hover { opacity: .9; }
  #urlGo svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  #urlCancel { display: none; background: transparent; border: 0; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 6px; flex: none; -webkit-tap-highlight-color: transparent; }
  #dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--muted); }
  #dot.live { background: var(--ok); }
  #dot.bad { background: var(--bad); }
  .rec-pill { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; margin: 0 4px; border-radius: 999px;
    border: 1px solid color-mix(in oklab, var(--bad) 45%, transparent); background: color-mix(in oklab, var(--bad) 14%, transparent);
    color: var(--bad); font: 700 11.5px system-ui, sans-serif; letter-spacing: .04em; cursor: pointer; font-variant-numeric: tabular-nums; }
  .rec-pill[hidden] { display: none; }
  .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); animation: pulse 1.4s infinite; }
  .rec-pill.paused { color: var(--muted); border-color: var(--line); background: var(--btn); }
  .rec-pill.paused .rec-dot { background: var(--muted); animation: none; border-radius: 1px; width: 7px; box-shadow: none; }
  #sessMenu { position: fixed; z-index: 60; top: 56px; right: 8px; width: 272px; max-width: calc(100vw - 16px); padding: 6px;
    background: var(--bar); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,.4); }
  #sessMenu[hidden] { display: none; }
  .ib.chev { width: 20px; margin-left: -4px; border-radius: 8px; color: var(--muted); }
  .ib.chev svg { width: 16px; height: 16px; }
  /* Other running sessions of the mesh, from the dashboard button's chevron (or hover). */
  #sessPop { position: fixed; z-index: 61; top: 52px; left: 8px; width: 320px; max-width: calc(100vw - 16px); max-height: min(70vh, 480px); overflow-y: auto;
    padding: 6px; background: var(--bar); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,.4); }
  #sessPop[hidden] { display: none; }
  #sessPop .sp-head { padding: 6px 10px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  #sessPop a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: inherit; text-decoration: none; }
  #sessPop a:hover, #sessPop a:focus-visible { background: var(--btn); outline: none; }
  #sessPop .sp-eng { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--btn); color: var(--muted); }
  #sessPop .sp-eng.firefox { color: #ff7139; } #sessPop .sp-eng.chromium { color: #4f8ff7; }
  #sessPop .sp-t { min-width: 0; display: flex; flex-direction: column; }
  #sessPop .sp-t b { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sessPop .sp-t span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sessPop .sp-empty { padding: 10px; color: var(--muted); font-size: 13px; }
  #sessPop hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
  #clipToast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); z-index: 80; padding: 7px 14px; border-radius: 99px;
    background: var(--bar); border: 1px solid var(--line); color: var(--fg); font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
  #view:focus { outline: none; }
  #passkeyDialog { border: 1px solid var(--line); border-radius: 14px; background: var(--bar); color: var(--fg); padding: 18px; width: min(380px, calc(100vw - 32px)); }
  #passkeyDialog::backdrop { background: rgba(0, 0, 0, .5); }
  #passkeyDialog h2 { margin: 0 0 6px; font-size: 16px; }
  #passkeyDialog p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
  #passkeyDialog .pk-info { color: var(--fg); padding: 8px 10px; border-radius: 9px; background: var(--btn); }
  #passkeyDialog .pk-entry { width: 100%; height: 38px; margin: -6px 0 14px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--btn); color: var(--fg); font: inherit; }
  /* The main action stands out; while the vault is checked it is visibly unavailable. */
  #passkeyDialog button[value="vault"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #passkeyDialog button:disabled { background: var(--btn); border-color: var(--line); color: var(--muted); opacity: .5; cursor: not-allowed; }
  #passkeyDialog .pk-info.checking::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 8px; vertical-align: -1px;
    border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: pk-spin .8s linear infinite; }
  @keyframes pk-spin { to { transform: rotate(360deg); } }
  #passkeyDialog .pk-info.locked { color: #f59e0b; background: rgba(245, 158, 11, .14); }
  #passkeyDialog .pk-info.bad { color: var(--bad); background: color-mix(in oklab, var(--bad) 14%, transparent); }
  #lastTabDialog { border: 1px solid var(--line); border-radius: 14px; background: var(--bar); color: var(--fg); padding: 18px; width: min(360px, calc(100vw - 32px)); }
  #lastTabDialog::backdrop { background: rgba(0, 0, 0, .5); }
  #lastTabDialog h2 { margin: 0 0 6px; font-size: 16px; }
  #lastTabDialog p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
  .ltd-actions { display: flex; flex-direction: column; gap: 8px; }
  .ltd-actions button { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--btn); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
  .ltd-actions button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  #audioBtn.on { color: var(--accent); }
  .sm-seg { display: flex; gap: 4px; padding: 4px; margin: 2px 4px 4px; border-radius: 10px; background: var(--btn); }
  .sm-seg button { flex: 1; height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .sm-seg button.on { background: var(--bar); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
  .sm-label { padding: 6px 10px 0; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  #stage.dropping::after { content: "Drop to send to the page"; position: absolute; inset: 10px; display: grid; place-items: center; z-index: 30;
    border: 2px dashed var(--accent); border-radius: 14px; background: rgba(124, 108, 240, .14); color: var(--fg); font-weight: 700; font-size: 15px; pointer-events: none; }
  #clipToast.show { opacity: 1; transform: translate(-50%, 0); }
  .sm-narrow { display: none; }
  @media (max-width: 640px) {
    #fwd, #reload { display: none; }
    .sm-narrow { display: flex; }
    .rec-pill { padding: 0; width: 28px; justify-content: center; margin: 0 2px; }
    #recPillText { display: none; }
  }
  #sessMenu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
  .sm-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 2px; font-weight: 700; font-size: 14px; }
  #smTitle { cursor: pointer; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sm-engine { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--btn); color: var(--muted); }
  .sm-status { padding: 0 10px 8px; font-size: 12px; color: var(--muted); }
  .sm-rec { display: flex; gap: 6px; padding: 2px 4px; }
  .sm-rec button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--btn); color: var(--fg); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .sm-rec button:hover { border-color: var(--muted); }
  .sm-rec button.rec { color: var(--bad); }
  .sm-rec svg, .sm-item svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sm-rec svg.fill { fill: currentColor; stroke: none; }
  .sm-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent;
    color: var(--fg); font: 500 13.5px system-ui, sans-serif; text-decoration: none; cursor: pointer; text-align: left; }
  .sm-item:hover { background: var(--btn); }
  .sm-search select { margin-left: auto; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--btn); color: inherit; font: inherit; }
  .sm-item:disabled { opacity: .4; }
  .sm-navrow { gap: 4px; }
  .sm-item.danger { color: var(--bad); }
  .sm-item.danger.armed { background: var(--bad); color: #fff; }
  #dot.wait { background: #d97706; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  @media (max-width: 640px) {
    #bar.url-focused .ib, #bar:has(#urlBar:focus-within) .ib { display: none !important; }
    #bar.url-focused #urlCancel, #bar:has(#urlBar:focus-within) #urlCancel { display: inline-block !important; }
    #bar.url-focused #urlBar, #bar:has(#urlBar:focus-within) #urlBar { margin: 0 !important; flex: 1 1 100% !important; width: 100% !important; }
  }

  /* stage */
  #stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
  canvas { flex: none; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; display: block; background: #fff; }
  #stage.fixed { align-items: center; justify-content: center; }
  #stage.fixed canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
  #ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: color-mix(in oklab, var(--accent) 45%, transparent); border: 2px solid var(--accent); }
  #ripple.go { animation: ripple .45s ease-out; }
  @keyframes ripple { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(1.5); } }
  #overlay { position: absolute; inset: 0; display: none; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: color-mix(in oklab, var(--bg) 82%, transparent); backdrop-filter: blur(6px); }
  #overlay.show { display: flex; }
  #overlay p { margin: 0; color: var(--muted); max-width: 28ch; }
  /* Tab switch in progress: the last picture stays, dimmed, until the new tab's first frame. */
  #switching { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .45); color: #fff; font-weight: 600; font-size: 14px; pointer-events: none; animation: fade-in .15s ease-out; }
  #switching[hidden] { display: none; }
  #switching.cached { inset: 10px 10px auto auto; flex-direction: row; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 99px;
    background: rgba(0, 0, 0, .6); font-size: 12px; }
  #switching.cached .spin { width: 14px; height: 14px; border-width: 2px; }
  #switching span { max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 12px; }
  @keyframes fade-in { from { opacity: 0; } }
  .spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn { padding: 12px 20px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; }

  /* keyboard helper row */
  #keys { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: none; gap: 6px; padding: 6px 8px; background: var(--bar); border-top: 1px solid var(--line); overflow-x: auto; }
  #keys.show { display: flex; }
  #keys button { flex: none; min-width: 52px; height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--btn); color: var(--fg); font-size: 14px; font-weight: 600; }
  #keys button.primary { background: var(--accent); color: #fff; margin-left: auto; }
  #bottom { flex: none; height: env(safe-area-inset-bottom); background: var(--bar); }

  /* the local input that raises the phone's native keyboard */
  #kb { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; padding: 0; border: 0; opacity: 0; font-size: 16px; /* >=16px: no iOS zoom */
    color: transparent; background: transparent; caret-color: transparent; -webkit-user-select: text; user-select: text; }

  /* page picker */
  #list { width: 100%; max-width: 560px; margin: 0 auto; padding: 14px; overflow: auto; align-self: flex-start; }
  #list h1 { font-size: 17px; margin: 4px 2px 12px; }
  #list button { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bar); color: var(--fg); font-size: 15px; }
  #list small { display: block; margin-top: 2px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* tabs modal */
  #tabCountBadge { position: absolute; font-size: 10px; font-weight: 700; color: currentColor; line-height: 1; pointer-events: none; }
  .tabs-modal-overlay { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end; justify-content: center;
    background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px); }
  .tabs-modal-overlay.open { display: flex; }
  @media (min-width: 640px) {
    .tabs-modal-overlay { align-items: center; }
  }
  .tabs-modal-card { width: 100%; max-width: 580px; max-height: 85vh; background: var(--bar); border: 1px solid var(--line);
    border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
  @media (min-width: 640px) {
    .tabs-modal-card { border-radius: 18px; }
  }
  .tabs-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); flex: none; }
  .tabs-list { overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .tab-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--bg); cursor: pointer; transition: border-color .15s, background .15s; }
  .tab-card:hover { border-color: var(--accent); background: color-mix(in oklab, var(--bg) 80%, var(--btn)); }
  .tab-card.active { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, var(--bg)); }
  .tab-info { flex: 1; min-width: 0; }
  .tab-title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-url { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .tab-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .tab-tag { font-size: 10.5px; font-weight: 600; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: var(--btn); color: var(--muted); }
  .tab-tag.current { background: var(--accent); color: #fff; }
  .tab-close { width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
  .tab-close:hover { background: var(--line); color: var(--bad); }

"use strict";

const params = new URLSearchParams(location.search);

const $ = (id) => document.getElementById(id);
const E = {
  smSearch: $("smSearch"),
  tabStrip: $("tabStrip"), tabsScroll: $("tabsScroll"), tabAddBtn: $("tabAddBtn"), tabsDrawerBtn: $("tabsDrawerBtn"), tabCountBadge: $("tabCountBadge"),
  bar: $("bar"), stage: $("stage"), view: $("view"), ripple: $("ripple"), overlay: $("overlay"), msg: $("msg"), spin: $("spin"), retry: $("retry"), overlayDash: $("overlayDash"),
  dot: $("dot"), urlBar: $("urlBar"), urlInput: $("urlInput"), urlClear: $("urlClear"), urlGo: $("urlGo"), urlCancel: $("urlCancel"),
  tabsModal: $("tabsModal"), tabsList: $("tabsList"), newTabBtn: $("newTabBtn"), closeTabsBtn: $("closeTabsBtn"),
  audioBtn: $("audioBtn"),
  kb: $("kb"), keys: $("keys"), dash: $("dash"), back: $("back"), fwd: $("fwd"), reload: $("reload"), kbbtn: $("kbbtn"),
  sessBtn: $("sessBtn"), sessMenu: $("sessMenu"), recPill: $("recPill")
};
const ctx = E.view.getContext("2d", { alpha: false, desynchronized: true }) || E.view.getContext("2d");

/* ---------------------------------------------------------------- drivers */
// The UI talks to a driver; CdpDriver serves Chromium, BidiDriver serves Firefox.
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

class Cdp {
  constructor(url, handlers) {
    this.handlers = handlers; this.id = 0; this.pending = new Map(); this.ws = new WebSocket(url);
    this.ready = new Promise((res, rej) => { this.ws.onopen = res; this.ws.onerror = () => rej(new Error("connection failed")); });
    this.ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.id) {
        const p = this.pending.get(m.id); if (!p) return; this.pending.delete(m.id);
        m.error ? p.rej(new Error(m.error.message)) : p.res(m.result);
      } else if (m.method) this.handlers.event(m.method, m.params);
    };
    this.ws.onclose = () => { for (const p of this.pending.values()) p.rej(new Error("closed")); this.pending.clear(); this.handlers.close(); };
  }
  call(method, params = {}) {
    return new Promise((res, rej) => {
      if (this.ws.readyState !== 1) return rej(new Error("closed"));
      const id = ++this.id; this.pending.set(id, { res, rej });
      this.ws.send(JSON.stringify({ id, method, params }));
    });
  }
  send(method, params) { this.call(method, params).catch(() => {}); }
  close() { try { this.ws.close(); } catch { /* already closed */ } }
}

const CDP_KEYS = {
  Enter: [13, "\r"], Tab: [9], Backspace: [8], Escape: [27], Delete: [46],
  ArrowLeft: [37], ArrowUp: [38], ArrowRight: [39], ArrowDown: [40], Home: [36], End: [35], PageUp: [33], PageDown: [34],
};

function speakerIcon() {
  const el = document.createElement("span");
  el.className = "audible";
  el.title = "Playing sound";
  el.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>`;
  return el;
}

// The session's window while Native/Phone has resized it, and its own size to go back to.
const winFit = { session: null, own: null, fitted: false };
// Height of the browser's toolbars above the page, per session. Measured only where
// outer and inner width agree (null otherwise): a page emulated at another size than
// its window (another viewer's Native, an automation client's viewport) gives
// nonsense, e.g. 0 (toolbars in the video) or 300 (page cut off).
const chromeHeights = {};
function chromeHeight(sessionId, measured) {
  if (measured > 0 && measured < 400) chromeHeights[sessionId] = measured;
  return chromeHeights[sessionId] ?? 87;
}

const CDP_BUTTONS = ["left", "middle", "right"], CDP_MASKS = [1, 4, 2];
// Runs in the remote page: holds a passkey sign-in (navigator.credentials.get) while a
// live view is attached (its heartbeat is fresh) until the view answers: with the
// vault's passkey in place the request goes on; cancelled (or failed) it is rejected
// like a cancelled browser dialog, since Chromium's own dialog can't be reached from
// the view. Autofill (conditional) requests and anything without a view pass through.
// Runs in the remote page: what a page puts on the clipboard (a "copy" button:
// navigator.clipboard.writeText, or a copy event as with execCommand("copy")) is
// handed to the live view too, which puts it on the local clipboard.
const CLIPBOARD_HOOK = `(() => {
  if (globalThis.__bdClipHooked || typeof globalThis.__bdClipboard !== "function") return;
  globalThis.__bdClipHooked = true;
  const send = (text) => { if (typeof text === "string" && text) try { globalThis.__bdClipboard(text); } catch {} };
  const cb = navigator.clipboard;
  if (cb && cb.writeText) {
    const writeText = cb.writeText.bind(cb);
    cb.writeText = (text) => { send(String(text)); return writeText(text).catch(() => {}); };
  }
  if (cb && cb.write) {
    const write = cb.write.bind(cb);
    cb.write = async (items) => {
      for (const item of items || []) {
        if (item.types && item.types.includes("text/plain")) send(await (await item.getType("text/plain")).text());
      }
      return write(items).catch(() => {});
    };
  }
  addEventListener("copy", (e) => {
    send(e.defaultPrevented && e.clipboardData ? e.clipboardData.getData("text/plain") : String(getSelection()));
  });
})()`;
const PASSKEY_HOOK = `(() => {
  const c = navigator.credentials;
  if (!c || c.__bdHooked) return;
  Object.defineProperty(c, "__bdHooked", { value: true });
  const get = c.get.bind(c), waiting = new Map();
  const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf.buffer ? buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.byteLength) : buf)))
    .replace(/\\+/g, "-").replace(/\\//g, "_").replace(/=+$/, "");
  const bytes = (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); s += "===".slice((s.length + 3) % 4); return Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0)).buffer; };
  // A signed assertion (from the vault, signed outside the browser) as the
  // PublicKeyCredential the page asked for.
  const credential = (a) => {
    const r = a.response, own = (o, props) => { for (const [k, v] of Object.entries(props)) Object.defineProperty(o, k, { value: v, enumerable: true }); return o; };
    const response = own(Object.create(AuthenticatorAssertionResponse.prototype), {
      clientDataJSON: bytes(r.clientDataJSON), authenticatorData: bytes(r.authenticatorData),
      signature: bytes(r.signature), userHandle: r.userHandle ? bytes(r.userHandle) : null,
    });
    const cred = own(Object.create(PublicKeyCredential.prototype), {
      id: a.id, rawId: bytes(a.rawId), type: "public-key", response, authenticatorAttachment: a.authenticatorAttachment || "platform",
    });
    Object.defineProperty(cred, "getClientExtensionResults", { value: () => ({}) });
    Object.defineProperty(cred, "toJSON", { value: () => ({ id: a.id, rawId: a.id, type: "public-key", authenticatorAttachment: a.authenticatorAttachment || "platform", response: r, clientExtensionResults: {} }) });
    return cred;
  };
  // answer: true = let the browser handle it (its authenticator has the passkey now),
  // false = cancelled, an object = the signed assertion to resolve with.
  globalThis.__bdPasskeyAnswer = (id, answer = true) => { const go = waiting.get(id); waiting.delete(id); go?.(answer); };
  c.get = function (opts) {
    const pk = opts && opts.publicKey;
    const viewed = Date.now() - (globalThis.__bdPasskeyAlive || 0) < 8000;
    if (!pk || opts.mediation === "conditional" || !viewed || typeof globalThis.__bdPasskey !== "function") return get(opts);
    const id = Math.random().toString(36).slice(2);
    let req;
    try {
      req = { id, rpId: pk.rpId || location.hostname, challenge: b64url(pk.challenge), allow: (pk.allowCredentials || []).map((x) => b64url(x.id)) };
    } catch { return get(opts); }
    return new Promise((go) => {
      waiting.set(id, go);
      setTimeout(() => globalThis.__bdPasskeyAnswer(id), 330000);
      try { globalThis.__bdPasskey(JSON.stringify(req)); } catch { globalThis.__bdPasskeyAnswer(id); }
    }).then((answer) => answer === true ? get(opts)
      : answer && typeof answer === "object" ? credential(answer)
      : Promise.reject(new DOMException("The operation either timed out or was not allowed.", "NotAllowedError")));
  };
})()`;

class CdpDriver {
  constructor(url, h) {
    this.h = h;
    this.cdp = new Cdp(url, { event: (m, p) => this.onEvent(m, p), close: () => h.close(this) });
    this.ready = this.cdp.ready;
  }
  isOpen() { return this.cdp.ws.readyState === WebSocket.OPEN || this.cdp.ws.readyState === WebSocket.CONNECTING; }
  close() { clearInterval(this.passkeyBeat); this.cdp.close(); }
  async start() {
    await this.cdp.call("Page.enable");
    // Chromium only paints (and screencasts) the tab in front of its window.
    await this.cdp.call("Page.bringToFront").catch(() => {});
    // Toolbar height, measured before any emulation: where the page starts on the
    // display (for the H.264 stream's capture region).
    this.chromeH = await this.evaluate("outerWidth === innerWidth ? outerHeight - innerHeight : null").catch(() => null);
    // Passkey requests started from this view are offered from the vault (see PASSKEY_HOOK).
    await this.cdp.call("Runtime.enable").catch(() => {});
    await this.cdp.call("Runtime.addBinding", { name: "__bdPasskey" }).catch(() => {});
    await this.cdp.call("Page.addScriptToEvaluateOnNewDocument", { source: PASSKEY_HOOK }).catch(() => {});
    this.evaluate(PASSKEY_HOOK).catch(() => {});
    await this.cdp.call("Runtime.addBinding", { name: "__bdClipboard" }).catch(() => {});
    await this.cdp.call("Page.addScriptToEvaluateOnNewDocument", { source: CLIPBOARD_HOOK }).catch(() => {});
    this.evaluate(CLIPBOARD_HOOK).catch(() => {});
    const beat = () => this.cdp.send("Runtime.evaluate", { expression: "globalThis.__bdPasskeyAlive = Date.now()" });
    this.passkeyBeatNow = beat;
    beat();
    this.passkeyBeat = setInterval(() => { if (this.isOpen()) beat(); else clearInterval(this.passkeyBeat); }, 3000);
  }
  // A passkey request held by the page's hook: go on (with or without the vault's passkey).
  passkeyAnswer(id, answer = true) {
    this.cdp.send("Runtime.evaluate", { expression: `globalThis.__bdPasskeyAnswer?.(${JSON.stringify(id)}, ${JSON.stringify(answer)})` });
  }
  // H.264 stream active: no screencast meanwhile; back to it when the stream ends.
  async setVideo(on) {
    if (this.video === on) return;
    this.video = on;
    if (on) await this.cdp.call("Page.stopScreencast").catch(() => {});
    else if (this.lastMetrics) await this.applyMetrics(this.lastMetrics).catch(() => {});
  }
  // The screencast delivers CSS-pixel frames even when a higher pixel density is
  // emulated, so Native and Phone would stay blurry on dense screens. Once the page
  // has been still for a moment, a screenshot (which honours the density) replaces
  // the frame: motion comes from the screencast, sharp text from the screenshot.
  // The user is interacting: frames from now on are real, not capture echoes.
  inputSeen() {
    this.echoUntil = 0;
    const now = performance.now();
    // Input means someone is watching: tell the page's passkey hook right away
    // (the 3 s heartbeat timer can be slowed down by the viewer's browser).
    if (this.passkeyBeatNow && now - (this.lastInput || -1e9) > 1000) this.passkeyBeatNow();
    this.lastInput = now;
  }
  scheduleSharp(meta) {
    clearTimeout(this.sharpTimer);
    const seq = this.sharpSeq = (this.sharpSeq || 0) + 1;
    if (!this.sharp || this.video) return;
    this.sharpTimer = setTimeout(async () => {
      // Taking the screenshot re-renders the page at the higher density, and the
      // screencast reports those renders as new frames (during and right after the
      // capture): ignore them, or they would replace the sharp picture and start
      // another round.
      this.echoUntil = Infinity;
      const r = await this.cdp.call("Page.captureScreenshot", this.sharpFormat).catch(() => null);
      this.echoUntil = performance.now() + 400;
      // A real change arrived before the capture started: this picture is stale.
      if (r?.data && seq === this.sharpSeq) await this.h.frame(r.data, meta, this.sharpFormat.format === "png" ? "image/png" : "image/jpeg");
    }, 300);
  }

  // The browser window itself follows the client's size (own display, density 1):
  // emulation alone would be scaled into the old window, which the H.264 stream
  // captures as is (letterboxed, small). Back to its own size otherwise.
  // The window is shared by the session's tabs (drivers), so its state is kept per session.
  async fitWindow(w, h) {
    const r = await this.cdp.call("Browser.getWindowForTarget").catch(() => null);
    if (!r?.windowId) return;
    if (winFit.session !== target?.sessionId) Object.assign(winFit, { session: target?.sessionId, own: null, fitted: false });
    if (!winFit.fitted) winFit.own = { width: r.bounds.width, height: r.bounds.height };

/* ---------------------------------------------------------------- connecting */
async function fetchTargets() {
  const list = await (await fetch("/json/list", { headers: authHeaders() })).json();
  return list.filter((x) => x.type === "page");
}

// A passkey request from the page's hook (either driver). Only a sign-in the user

    if (!res.ok) throw new Error(body.error || res.statusText);

    { method: "POST", body: JSON.stringify({ page_id: pageId, rp_id: rpId, find, entry, ...signing }) });
  for (const until = Date.now() + 340000; Date.now() < until;) {
    await new Promise((r) => setTimeout(r, 1000));

// Before approving: is rbw locked, and which entry would sign in?
async function showPasskeyEntry(rpId, dlg) {
  const info = $("passkeyInfo"), pick = $("passkeyEntry"), use = dlg.querySelector('button[value="vault"]');
  const cancel = dlg.querySelector('button[value="cancel"]');
  cancel.textContent = "Cancel";
  use.hidden = false;
  const set = (text, cls = "") => { if (dlg.open) { info.textContent = text; info.className = "pk-info " + cls; } };
  const label = (e) => { const who = e.user || e.passkey_user; return `${e.name || "?"}${who ? ` (${who})` : ""}`; };
  set("Checking the vault…", "checking");
  pick.hidden = true;
  pick.innerHTML = "";
  // Not before the lookup: rbw would have to guess the entry (and fails with several).
  use.disabled = true;
  try {
    const found = await passkeyHelper(rpId, true);
    if (found?.locked) { set("rbw is locked: approving asks your phone to unlock it first.", "locked"); use.disabled = false; }
    else if (!Array.isArray(found) || !found.length) {
      // Nothing to approve: say so and get out of the way. The site hears "cancelled"
      // and usually offers another way to sign in (password, code, ...).
      set(`No passkey for ${rpId} in your vault: sign in another way.`, "bad");
      use.hidden = true;
      cancel.textContent = "OK";
      cancel.focus();
      setTimeout(() => { if (dlg.open && $("passkeyRp").textContent === rpId) dlg.close("cancel"); }, 6000);
    }
    else if (found.length === 1) { set(`Entry: ${label(found[0])}`); use.disabled = false; }
    else {
      use.disabled = false;
      // Several entries hold a passkey for this site: the user picks one.
      set(`${found.length} entries hold a passkey for ${rpId}:`);
      for (const e of found) pick.add(new Option(label(e), e.id));
      pick.hidden = false;
    }
  } catch (err) {
    set(err.message, "bad");
    // The lookup itself failed (e.g. an old helper): rbw may still find the entry.
    use.disabled = /no passkey|no matching|no entry|No passkey helper/i.test(err.message);

}
async function askPasskey({ rpId, challenge, allow }) {
  const dlg = $("passkeyDialog");
  $("passkeyRp").textContent = rpId;
  dlg.showModal();
  showPasskeyEntry(rpId, dlg);
  const choice = await new Promise((done) => dlg.addEventListener("close", () => done(dlg.returnValue), { once: true }));
  if (choice !== "vault" || !target?.sessionId) return false;
  toast(`Getting the passkey for ${rpId}…`, 0);
  try {
    let shown = "";
    const entry = $("passkeyEntry").hidden ? null : $("passkeyEntry").value || null;
    const onNote = (note) => { if (note !== shown) { shown = note; toast(`${rpId}: ${note}`, 0); } };
    // Chromium: the passkey goes into its authenticator and the page's request goes on.
    // Firefox: the request is signed outside the browser and the page gets the result.
    const signed = target?.engine === "firefox";
    const result = await passkeyHelper(rpId, false, onNote, entry, signed ? { challenge, allow } : {});
    toast(`Signing in to ${rpId} with your passkey`);

const handlers = {

    return drawFrame(data, m, mime, seq);
  },
  loading: () => { E.dot.className = "wait"; },
  navigated: (url) => {
    if (url && url !== "about:blank") {
      currentUrl = url;
      if (document.activeElement !== E.urlInput) E.urlInput.value = currentUrl;
    }
    refreshInfo();
  },
  loaded: () => {
    E.dot.className = "live";

    // again resizes the window and restarts the stream, which flickers.
    if (fitLayout && target && target.engine !== "firefox") applyMetrics({ ifDrifted: true });

  dialog: async ({ type, message, defaultValue }) => {

  gone: (why) => setState("bad", stopping ? "Session stopped" : why),
  // The page opened a popup or a new tab: the browser shows that one now, so the view

  popup: async (url, id = null) => {

      const others = tabs.filter((t) => t.sessionId === target?.sessionId && t.id !== opener);
      const fresh = others.filter((t) => !knownTabs.has(t.id));
      const real = url && url !== "about:blank";

      // refreshes on a timer, so it may already count as seen).

      // another tab of the same session, else the dashboard, not a dead end.

function sizeCanvas() {

    const stageRect = E.stage.getBoundingClientRect();
    // Native, sized down for a smaller viewer: 1:1 in the middle rather than stretched.
    const fits = layoutMode === "native"
      ? meta.deviceWidth <= stageRect.width + 1 && meta.deviceHeight <= stageRect.height + 1
      : Math.abs(stageRect.width - meta.deviceWidth) < 25;
    if (stageRect.width > 0 && fits) {
      E.view.style.width = meta.deviceWidth + "px";
      E.view.style.height = meta.deviceHeight + "px";
    } else {
      E.view.style.width = "";
      E.view.style.height = "";
    }
  } else {
    E.view.style.width = "";
    E.view.style.height = "";
  }

function base64ToBlob(b64, mime = "image/jpeg") {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });

let lastBitmap = null;

/* ---------------------------------------------------------------- touch: tap = click, drag = finger */
function toPage(e) {
  const r = E.view.getBoundingClientRect();
  const s = Math.min(r.width / E.view.width, r.height / E.view.height);
  const dw = E.view.width * s, dh = E.view.height * s;
  const ox = r.left + (r.width - dw) / 2, oy = r.top + (r.height - dh) / 2;
  const fx = (e.clientX - ox) / dw, fy = (e.clientY - oy) / dh;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return null;
  const psf = meta.pageScaleFactor || 1;
  const offY = meta.offsetTop || 0;
  return {
    x: (fx * meta.deviceWidth) / psf,
    y: (fy * meta.deviceHeight - offY) / psf,
    scale: (meta.deviceHeight / dh) / psf

// Is the element at (x, y) of the remote page a text field (or a label for one)?
function hitExpr(x, y) {
  return `(() => {
    let d = document, x = ${x}, y = ${y}, el = null;
    for (let i = 0; i < 6; i++) {
      el = d.elementFromPoint(x, y);
      if (!el) return false;
      if (el.shadowRoot) { const s = el.shadowRoot.elementFromPoint(x, y); if (s) el = s; }
      if ((el.tagName === "IFRAME" || el.tagName === "FRAME") && el.contentDocument) {
        const r = el.getBoundingClientRect(); x -= r.left; y -= r.top; d = el.contentDocument; continue;
      }
      break;
    }
    const f = el.closest("input, textarea, label, [contenteditable]");
    if (!f) return false;
    if (f.tagName === "LABEL") return !!(f.control && f.control.matches("input, textarea"));
    const non = ["button","submit","checkbox","radio","range","color","file","image","reset","hidden"];
    return f.tagName === "TEXTAREA" || f.isContentEditable || !non.includes((f.type || "").toLowerCase());
  })()`;
}

let pendingWheel = null;
let wheelRaf = false;

function queueWheel(x, y, dx, dy) {
  if (!drv) return;
  if (!pendingWheel) {
    pendingWheel = { x, y, dx: 0, dy: 0 };

  pendingWheel.x = x;
  pendingWheel.y = y;
  pendingWheel.dx += dx;
  pendingWheel.dy += dy;
  if (!wheelRaf) {
    wheelRaf = true;
    requestAnimationFrame(flushWheel);
  }

function flushWheel() {
  wheelRaf = false;
  if (!pendingWheel || !drv) return;
  const { x, y, dx, dy } = pendingWheel;
  pendingWheel = null;
  if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
    drv.wheel(x, y, dx, dy);
  }

    showKeyboard(info);

// Input types whose native keyboard we mirror; anything else (number, date, ...) gets the text one.
const KB_TYPES = new Set(["email", "tel", "url", "search", "password"]);

  $("switching").classList.toggle("cached", !!cached);

      method: "PUT",
      headers: authHeaders()

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || res.statusText);

  if (siblings.length <= 1 && siblings.some((p) => p.id === id)) {
    const choice = await askLastTab();
    if (choice === "cancel") return;
    if (choice === "stop") {
      try {
        stopping = true;
        await sessionApi("DELETE", "");
        if (drv) drv.close();
        location.href = "/";
      } catch (err) {
        stopping = false;
        alert("Could not stop the session: " + err.message);

    // Keep the session: open a blank tab first, then close this one.
    try {
      const qs = new URLSearchParams({ url: "about:blank", session_id: target.sessionId });
      const res = await fetch("/json/new?" + qs.toString(), { method: "PUT", headers: authHeaders() });

async function copyRemoteSelection() {
  if (!drv) return '';
  try {
    const text = await drv.evaluate(`(() => {
        let sel = window.getSelection()?.toString() || '';
        if (!sel && document.activeElement) {
          let el = document.activeElement;
          if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            try {
              sel = el.value.substring(el.selectionStart, el.selectionEnd);
            } catch(e) {}
          }
        }
        return sel;
      })()`);
    if (text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      }
      return text;
    }
  } catch(e) {
    console.warn("copyRemoteSelection failed:", e);
  }
  return '';
}

  } catch(e) {

  }
}

// Desktop: type straight into the page. Copy, cut and paste use the browser's own clipboard
// events (no permission prompt): the remote selection is fetched ahead of time, after every
// mouse release or key press, because a copy event has to be answered synchronously.
let remoteSel = "", selTimer = 0;
const SEL_EXPR = `(() => {
  let a = document.activeElement;
  while (a && a.shadowRoot && a.shadowRoot.activeElement) a = a.shadowRoot.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) {
    try { if (a.selectionEnd > a.selectionStart) return a.value.substring(a.selectionStart, a.selectionEnd); } catch (e) {}
  }
  return window.getSelection()?.toString() || "";
})()`;
function refreshRemoteSelection(delay = 120) {
  clearTimeout(selTimer);
  selTimer = setTimeout(() => {
    if (drv) drv.evaluate(SEL_EXPR).then((t) => { remoteSel = t || ""; }).catch(() => {});
  }, delay);
}
const localTyping = () => !drv || document.activeElement === E.kb || document.activeElement === E.urlInput
  || !!document.activeElement?.closest?.("#sessMenu, #tabsModal, dialog");
const SHORTCUTS = { a: "selectAll", z: "undo", y: "redo" };
window.addEventListener("keydown", (e) => {
  if (localTyping()) return;
  // Named keys go with whatever modifiers are held: Ctrl+Backspace/Delete (words),
  // Ctrl+arrows, Shift+arrows (select), Ctrl+Home/End, ...
  if (KEYS[e.key] && (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) && drv) {
    e.preventDefault();
    pressKey(e.key, { ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, meta: e.metaKey });
    refreshRemoteSelection(250);
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey) {
    const k = e.key.toLowerCase();
    // c, x, v: let the native copy/cut/paste events fire (handled below); should the
    // browser skip the event (nothing selected locally), fall back to the async clipboard API.
    if (k === "c" || k === "x" || k === "v") {
      clipEventSeen = false;
      setTimeout(() => {
        if (clipEventSeen || !drv) return;
        if (k === "v") pasteToRemote();
        else copyRemoteSelection().then((t) => {
          toast(t ? (k === "x" ? "Cut" : "Copied") : "Nothing selected");
          if (t && k === "x") drv.evaluate(`document.execCommand("delete")`).catch(() => {});
        });
      }, 60);
      return;
    }
    if (k in SHORTCUTS) {
      e.preventDefault();
      const redo = k === "z" && e.shiftKey;
      drv.shortcut(redo ? "z" : k, e.shiftKey, redo ? "redo" : SHORTCUTS[k]);
      refreshRemoteSelection();
      return;
    }
    // Captured: the page gets Ctrl+T, Ctrl+W, Ctrl+L, … too. Otherwise they stay local.
    if (captured && /^[a-z]$/.test(k)) { e.preventDefault(); drv.shortcut(k, e.shiftKey, null); }
    return;
  }
  if (mod || e.altKey) return;
  if (e.key.length === 1) { drv.insertText(e.key); e.preventDefault(); }
  else if (KEYS[e.key]) { pressKey(e.key); e.preventDefault(); }
  else return;
  refreshRemoteSelection(250);
});
let clipEventSeen = false;
function copyFromRemote(e, cut) {
  if (localTyping()) return;
  clipEventSeen = true;
  e.preventDefault();
  if (remoteSel) {
    e.clipboardData.setData("text/plain", remoteSel);
    toast(cut ? "Cut" : "Copied");
  } else {
    // Nothing cached yet (selection made by a script, say): ask now and write asynchronously.
    copyRemoteSelection().then((t) => toast(t ? (cut ? "Cut" : "Copied") : "Nothing selected"));
  }
  if (cut) drv.evaluate(`document.execCommand("delete")`).catch(() => {}).finally(() => refreshRemoteSelection());
}

/* ---------------------------------------------------------------- drag & drop files */
// Files dropped on the picture are stored on the browser's host, then dropped onto the
// page at the same spot (file inputs and drop zones both take them).
let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
E.stage.addEventListener("dragenter", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  E.stage.classList.add("dropping");
});
E.stage.addEventListener("dragover", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
});
E.stage.addEventListener("dragleave", () => {
  if (--dragDepth <= 0) { dragDepth = 0; E.stage.classList.remove("dropping"); }
});
E.stage.addEventListener("drop", async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  E.stage.classList.remove("dropping");
  const files = [...e.dataTransfer.files];
  const p = toPage(e);
  if (!files.length || !drv || !target?.sessionId) return;
  if (!p) { toast("Drop onto the page"); return; }
  const label = files.length === 1 ? files[0].name : `${files.length} files`;
  try {
    toast(`Sending ${label}…`, 0);
    const paths = [];
    for (const f of files) {
      const res = await fetch(`/api/sessions/${encodeURIComponent(target.sessionId)}/files?name=${encodeURIComponent(f.name)}`,
        { method: "PUT", headers: authHeaders({ "Content-Type": "application/octet-stream" }), body: f });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
      paths.push((await res.json()).path);
    }
    await drv.dropFiles(Math.round(p.x), Math.round(p.y), paths);
    toast(`Dropped ${label}`);
  } catch (err) {
    toast(`Could not drop ${label}: ${err.message}`, 4000);
  }
});

function canVideo() {
  // Native/Phone in Firefox: its viewport cannot be matched by a window size here.
  return !!(sess?.video && window.VideoDecoder && drv && streamPref() === "video"
    && !(fitLayout && Math.min(devicePixelRatio || 1, 2) > 1.05)
    && !(fitLayout && target?.engine === "firefox"));
}
// fallback: hand the picture back to the screencast.
function stopVideo(fallback = false) {
  const { ws, decoder } = video;
  Object.assign(video, { ws: null, decoder: null, region: null, session: null, waitingKey: true, keyWait: 0 });
  try { ws?.close(); } catch { /* closed */ }
  try { if (decoder && decoder.state !== "closed") decoder.close(); } catch { /* closed */ }
  if (fallback && drv) drv.setVideo(false);
}
async function startVideo() {
  const d = drv;
  if (!d || !target?.sessionId) return;
  const m = await d.evaluate(`[...${VIEW_SIZE}, outerWidth === innerWidth ? outerHeight - innerHeight : null]`).catch(() => null);
  if (!m || d !== drv) return;
  // Window layout: no emulation, so the live value (follows bars that come and go).
  const region = { x: 0, y: chromeHeight(target.sessionId, fitLayout ? d.chromeH : m[2]), w: m[0], h: m[1] };
  const same = video.ws && video.session === target.sessionId && video.region
    && ["x", "y", "w", "h"].every((k) => video.region[k] === region[k]);
  // Same display and area (e.g. another tab): keep the stream, pause this driver's screencast.
  if (same) { await d.setVideo(true); return; }
  stopVideo();
  const decoder = new VideoDecoder({
    output: (frame) => drawVideoFrame(frame),
    error: (e) => { console.warn("video decoder:", e); if (video.decoder === decoder) stopVideo(true); },
  });
  decoder.configure({ codec: "avc1.640033", optimizeForLatency: true });
  const scheme = location.protocol === "https:" ? "wss://" : "ws://";
  const qs = new URLSearchParams({ session_id: target.sessionId, ...Object.fromEntries(Object.entries(region).map(([k, v]) => [k, Math.round(v)])) });
  const ws = new WebSocket(`${scheme}${location.host}/video?${qs}`);

  ws.onmessage = (e) => {
    if (video.ws !== ws || decoder.state !== "configured") return;
    const b = new Uint8Array(e.data);
    const key = b[0] === 1;
    if (video.waitingKey && !key) {
      // No keyframe for a while (one got lost): a fresh encoder starts with one.
      video.keyWait ||= performance.now();
      if (performance.now() - video.keyWait > 2000) { stopVideo(); startVideo(); }
      return;
    }
    video.waitingKey = false;
    // Behind (slow device): skip to the next keyframe rather than lag further.
    if (decoder.decodeQueueSize > 3 && !key) return;

}
function drawVideoFrame(frame) {
  try {
    // The server rounds the region to even sizes: one frame pixel is one page pixel.
    meta = { deviceWidth: frame.displayWidth, deviceHeight: frame.displayHeight, pageScaleFactor: 1, offsetTop: 0 };
    hadFrame = true;
    endSwitching();
    if (E.view.width !== frame.displayWidth || E.view.height !== frame.displayHeight) {
      E.view.width = frame.displayWidth;
      E.view.height = frame.displayHeight;
    }
    sizeCanvas();
    ctx.drawImage(frame, 0, 0);
  } finally {
    frame.close();
  }
}

/* ---------------------------------------------------------------- audio */
// The session's sound: Opus in WebM from /audio, played through MediaSource and kept
// close to live (a phone that stalls must not drift seconds behind the picture).
const AUDIO_ICONS = {
  off: '<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>',
  on: '<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
};
const audio = { el: null, ws: null, ms: null, sb: null, queue: [], session: null };
// Sound is on unless the viewer turned it off (remembered per browser).
let audioWanted = true;
try { audioWanted = localStorage.getItem("handoff.audio") !== "0"; } catch { /* storage unavailable */ }
function renderAudioButton() {
  const on = !!audio.el;
  E.audioBtn.innerHTML = (on ? AUDIO_ICONS.on : AUDIO_ICONS.off) + (on ? "Sound on" : "Sound off");
  E.audioBtn.title = on ? "Mute the page's sound" : "Play the page's sound";
  E.audioBtn.setAttribute("aria-checked", String(on));
}
// Browsers only start playback after a click or key press on this page: until then
// the stream buffers, and the first interaction starts it (the backlog is skipped).
function playWhenAllowed(el) {
  el.play().catch(() => {
    const go = () => { if (audio.el === el) el.play().catch(() => {}); };
    for (const t of ["pointerdown", "keydown"]) addEventListener(t, go, { once: true, capture: true });
  });
}
function stopAudio() {
  try { audio.ws?.close(); } catch { /* closed */ }
  if (audio.el) { audio.el.pause(); URL.revokeObjectURL(audio.el.src); audio.el.removeAttribute("src"); }
  Object.assign(audio, { el: null, ws: null, ms: null, sb: null, queue: [], session: null, appending: false, synced: false });
  renderAudioButton();
}
// Keep ~0.4 s of sound buffered: enough to ride out network jitter, little enough to
// stay close to the picture. Drift is corrected by playing slightly faster or slower
// (pitch is preserved); only falling far behind jumps, which is audible.
function pumpAudio() {
  const { sb, el } = audio;
  if (!sb || sb.updating || audio.appending) return;
  const b = sb.buffered;
  if (b.length) {
    const end = b.end(b.length - 1), ahead = end - el.currentTime;
    // Start (sound piles up before playback begins) or far behind: jump to live.
    if (ahead > 2 || (!audio.synced && ahead > 0.6)) { el.currentTime = end - 0.4; el.playbackRate = 1; audio.synced = true; }
    else el.playbackRate = ahead > 1 ? 1.1 : ahead > 0.5 ? 1.05 : ahead < 0.2 ? 0.96 : 1;
    if (el.currentTime - b.start(0) > 30) { sb.remove(b.start(0), el.currentTime - 15); return; }
  }
  if (!audio.queue.length) return;
  // One append at a time: merging chunks is asynchronous, and a second append while
  // one is pending throws (which used to stop the sound).
  const parts = audio.queue;
  audio.queue = [];
  audio.appending = true;
  (parts.length === 1 ? Promise.resolve(parts[0]) : new Blob(parts).arrayBuffer()).then((buf) => {
    audio.appending = false;
    if (audio.sb !== sb) return;
    try { sb.appendBuffer(buf); } catch { stopAudio(); }
  });
}
// Must run inside the click: browsers only allow playback started by a gesture.
function startAudio() {
  const sessionId = target?.sessionId;
  const type = 'audio/webm; codecs="opus"';
  if (!sessionId || !window.MediaSource || !MediaSource.isTypeSupported(type)) {
    toast("This browser cannot play the stream", 3000);
    return;
  }
  const el = new Audio();
  const ms = new MediaSource();
  el.src = URL.createObjectURL(ms);
  Object.assign(audio, { el, ms, queue: [], session: sessionId, appending: false, synced: false });
  playWhenAllowed(el);
  ms.addEventListener("sourceopen", () => {
    audio.sb = ms.addSourceBuffer(type);
    audio.sb.mode = "sequence";
    audio.sb.addEventListener("updateend", pumpAudio);
    const scheme = location.protocol === "https:" ? "wss://" : "ws://";
    const ws = new WebSocket(`${scheme}${location.host}/audio?session_id=${encodeURIComponent(sessionId)}`);
    ws.binaryType = "arraybuffer";
    ws.onmessage = (e) => { audio.queue.push(e.data); pumpAudio(); };
    // Dropped (node restart, network): the next session refresh reconnects it.
    ws.onclose = () => { if (audio.ws === ws) stopAudio(); };
    audio.ws = ws;
  }, { once: true });
  renderAudioButton();
}
E.audioBtn.onclick = () => {
  audioWanted = !audio.el;
  try { localStorage.setItem("handoff.audio", audioWanted ? "1" : "0"); } catch { /* storage unavailable */ }
  audioWanted ? startAudio() : stopAudio();
};
renderAudioButton();

/* ---------------------------------------------------------------- shared Native size */
// Every view of a session tells the node its screen size while in Native or Phone
// layout and gets back the smallest width and height among those views.
const viewers = { ws: null, session: null, native: null, forced: false, heard: false, own: null, sent: undefined, count: 1 };
function connectViewers() {
  const sessionId = target?.sessionId;
  if (viewers.ws && viewers.session === sessionId) return;
  try { viewers.ws?.close(); } catch { /* closed */ }
  Object.assign(viewers, { ws: null, session: sessionId, native: null, forced: false, heard: false, sent: undefined, count: 1 });
  if (!sessionId) return;
  const scheme = location.protocol === "https:" ? "wss://" : "ws://";
  const ws = new WebSocket(`${scheme}${location.host}/viewers?session_id=${encodeURIComponent(sessionId)}`);
  ws.onopen = () => reportViewerSize(viewers.own);
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    viewers.count = m.viewers || 1;
    viewers.native = m.native;
    viewers.forced = !!m.forced;
    viewers.heard = true;
    // Every change among the viewers: a view that just let go of its size may have
    // cleared the page's emulation, so the remaining Native/Phone viewers set it again.
    if (layoutMode !== "window") applyMetrics();
  };
  // Dropped (node restart, network): the next session refresh reconnects it.
  ws.onclose = () => { if (viewers.ws === ws) Object.assign(viewers, { ws: null, native: null, forced: false, heard: false }); };
  viewers.ws = ws;
}
function reportViewerSize(native) {
  viewers.own = native;
  const msg = JSON.stringify({ native, force: forceSize && !!native });
  if (viewers.ws?.readyState !== WebSocket.OPEN || msg === viewers.sent) return;
  viewers.sent = msg;
  viewers.ws.send(msg);
}

/* ---------------------------------------------------------------- other sessions */
// The dashboard button's chevron (and, with a mouse, hovering it) lists the mesh's
// other running sessions; picking one opens its handoff view.
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmtAge = (secs) => (secs < 60 ? `${secs | 0}s` : secs < 3600 ? `${(secs / 60) | 0}m` : `${(secs / 3600) | 0}h ${((secs % 3600) / 60) | 0}m`);
let sessPopTimer = 0;
async function openSessPop() {
  const pop = $("sessPop");
  const r = $("dash").getBoundingClientRect();
  pop.style.left = Math.max(8, r.left) + "px";
  pop.style.top = r.bottom + 6 + "px";
  if (pop.hidden) pop.innerHTML = '<div class="sp-empty">Loading sessions…</div>';
  pop.hidden = false;
  $("dashMore").setAttribute("aria-expanded", "true");
  try {
    const res = await fetch("/api/mesh/overview", { headers: authHeaders() });
    if (!res.ok) throw new Error(res.statusText);
    const ov = await res.json();
    const others = (ov.sessions || []).filter((x) => x.id !== target?.sessionId)
      .sort((a, b) => a.uptime_seconds - b.uptime_seconds);
    const firstTab = (x) => (ov.targets || []).find((t) => t.sessionId === x.id && t.node_name === x.node_name && t.type === "page" && t.url !== "about:blank");
    const local = ov.local_node?.name;
    pop.innerHTML = `<div class="sp-head">Other sessions</div>` + (others.length ? others.map((x) => {
      const tab = firstTab(x);
      const base = x.node_name === local ? "" : (x.node_url || "").replace(/\/$/, "");
      const href = `${base}/handoff/?session=${encodeURIComponent(x.id)}`;
      const eng = x.engine === "firefox" ? "firefox" : "chromium";
      return `<a href="${esc(href)}" role="menuitem"><span class="sp-eng ${eng}" title="${eng === "firefox" ? "Firefox" : "Chromium"}">${eng === "firefox" ? "FF" : "CR"}</span>`
        + `<span class="sp-t"><b>${x.audible ? speakerIcon().outerHTML : ""}${esc(x.name || x.profile || "Throwaway")}</b><span>${esc(x.node_name)} · ${x.name ? esc(x.profile || "Throwaway") + " · " : ""}${fmtAge(x.uptime_seconds || 0)}${tab ? " · " + esc(tab.title || tab.url) : ""}</span></span></a>`;
    }).join("") : '<div class="sp-empty">No other sessions are running.</div>') + '<hr><a href="/" role="menuitem"><span class="sp-eng">⌂</span><span class="sp-t"><b>Dashboard</b></span></a>';
  } catch (err) {
    pop.innerHTML = `<div class="sp-empty">Could not load sessions (${esc(err.message)}).</div>`;
  }
}
function closeSessPop() {
  clearTimeout(sessPopTimer);
  $("sessPop").hidden = true;
  $("dashMore").setAttribute("aria-expanded", "false");
}
$("dashMore").onclick = (e) => { e.stopPropagation(); $("sessPop").hidden ? openSessPop() : closeSessPop(); };
// Hover (mouse only): open after a short pause, close once the pointer leaves both.
if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
  const enter = () => { clearTimeout(sessPopTimer); if ($("sessPop").hidden) sessPopTimer = setTimeout(openSessPop, 350); };
  const leave = () => { clearTimeout(sessPopTimer); sessPopTimer = setTimeout(closeSessPop, 300); };
  for (const el of [$("dash"), $("dashMore"), $("sessPop")]) { el.addEventListener("mouseenter", enter); el.addEventListener("mouseleave", leave); }
}
document.addEventListener("pointerdown", (e) => { if (!$("sessPop").hidden && !e.target.closest("#sessPop, #dashMore, #dash")) closeSessPop(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("sessPop").hidden) closeSessPop(); });

$("smStream").value = streamPref();
$("smStream").onchange = () => {
  try { localStorage.setItem("handoff.stream", $("smStream").value); } catch { /* storage unavailable */ }
  if (canVideo()) startVideo(); else stopVideo(true);
};

function renderSession() {
  if (!sess) return;
  E.sessBtn.hidden = false;
  const rec = sess.is_recording, paused = rec && sess.recording_paused;
  E.recPill.hidden = !rec;
  E.recPill.classList.toggle("paused", paused);
  $("recPillText").textContent = paused ? "PAUSED" : "REC";
  $("smEngine").textContent = sess.engine || "chromium";
  $("smDevtools").hidden = (sess.engine || "chromium") !== "chromium";
  $("smTitle").textContent = sess.name || (sess.profile ? `Profile ${sess.profile}` : "Session");
  $("smStatus").textContent = (sess.profile ? `Profile ${sess.profile}` : sess.persistent ? "Persistent" : "Throwaway")
    + ` · Up ${fmtDur(sess.uptime_seconds || 0)} · ${sess.tabs_count} tab${sess.tabs_count === 1 ? "" : "s"}`
    + (rec ? (paused ? " · recording paused" : " · recording") : "")
    + (sess.proxy ? ` · via ${proxyNames[sess.proxy] || sess.proxy}` : "");
  if (document.activeElement !== $("smProxy")) $("smProxy").value = sess.proxy || "none";
  E.audioBtn.hidden = !sess.audio;
  // Another session (switched from the drawer): its sound, not the old one's.
  if (audio.el && audio.session !== target?.sessionId) stopAudio();
  if (sess.audio && audioWanted && !audio.el) startAudio();
  connectViewers();
  // An automation client came or went: Native/Phone pause or resume.
  if (layoutMode !== "window" && ((sess.client_count || 0) > 0) !== metricsYielding) applyMetrics();
  $("smStreamRow").hidden = !sess.video || !window.VideoDecoder;
  if (canVideo() && !video.ws) startVideo();
  const btn = (act, icon, label, cls = "") => `<button data-rec="${act}" class="${cls}">${ICON[icon]}${label}</button>`;
  const html = !rec ? btn("record", "rec", "Start recording", "rec")
    : (paused ? btn("resume-record", "play", "Resume") : btn("pause-record", "pause", "Pause")) + btn("stop-record", "stop", "Stop", "rec");
  const box = $("smRec");
  if (box._html !== html) { box.innerHTML = html; box._html = html; }
}

function toggleSessMenu(open = E.sessMenu.hidden) {
  E.sessMenu.hidden = !open;
  E.sessBtn.classList.toggle("on", open);
  disarmStop();
  if (open) {
    const r = E.sessBtn.getBoundingClientRect();
    E.sessMenu.style.top = (r.bottom + 6) + "px";
    $("smFwd").disabled = E.fwd.disabled;
    refreshSession();
  }
}
function disarmStop() {
  clearTimeout(stopArmed); stopArmed = 0;
  $("smStop").classList.remove("armed");
  $("smStopText").textContent = "Stop session";
}

E.sessBtn.onclick = (e) => { e.stopPropagation(); toggleSessMenu(); };
E.recPill.onclick = (e) => { e.stopPropagation(); toggleSessMenu(true); };
document.addEventListener("pointerdown", (e) => {
  if (!E.sessMenu.hidden && !e.target.closest("#sessMenu, #sessBtn, #recPill")) toggleSessMenu(false);
});
$("smFwd").onclick = () => { toggleSessMenu(false); E.fwd.click(); };
$("smReload").onclick = () => { toggleSessMenu(false); E.reload.click(); };
$("smRec").onclick = async (e) => {
  const b = e.target.closest("[data-rec]");
  if (!b) return;
  b.disabled = true;
  try {
    await sessionApi("POST", "/" + b.dataset.rec);
  } catch (err) {
    $("smStatus").textContent = "Failed: " + err.message;
  }
  await refreshSession();
};
// Two taps (desktop: two clicks) so a stray touch cannot kill the browser.
$("smStop").onclick = async () => {
  if (!stopArmed) {
    $("smStop").classList.add("armed");
    $("smStopText").textContent = sess?.persistent || sess?.profile ? "Tap again to stop (profile is kept)" : "Tap again to stop and discard";
    stopArmed = setTimeout(disarmStop, 4000);
    return;
  }
  disarmStop();
  $("smStopText").textContent = "Stopping…";
  try {
    stopping = true;
    await sessionApi("DELETE", "");
    if (drv) drv.close();
    location.href = "/";
  } catch (err) {
    stopping = false;
    $("smStatus").textContent = "Could not stop: " + err.message;
    $("smStopText").textContent = "Stop session";
  }
};
function startSessionPolling() {
  clearInterval(sessTimer);
  refreshSession();
  sessTimer = setInterval(() => { if (document.visibilityState === "visible") refreshSession(); }, 5000);
}

// ?session=<id> (dashboard launch): open that session's first tab.
async function boot() {
  const sessionId = params.get("session");
  if (!pageId && sessionId) {
    setState("wait");
    connectStep("waiting for the session's first tab");
    for (let i = 0; i < 20; i++) {
      const page = (await fetchTargets().catch(() => [])).find((t) => t.sessionId === sessionId);
      if (page) {
        const u = new URL(location.href);
        u.searchParams.delete("session");
        u.searchParams.set("page", page.id);
        location.replace(u.toString());
        return;
      }
      await sleep(500);
    }
  }
  if (params.has("newtab")) {
    const u = new URL(location.href);
    u.searchParams.delete("newtab");
    history.replaceState(null, "", u.toString());
    E.urlInput.value = "";
    E.urlInput.focus();
  }
  if (pageId) connect();
  else pickPage().catch((e) => setState("bad", String(e)));
}
boot();
