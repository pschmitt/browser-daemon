[package]
name = "browser-daemon"
version = "0.4.2"
edition = "2021"
rust-version = "1.88"
authors = ["Philipp Schmitt <philipp@schmitt.co>"]
description = "Native headless/headful browser daemon for NixOS with CDP multiplexing and handoff"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "net", "process", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
tower-http = { version = "0.7", features = ["fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
hmac = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = "0.11"
psl = "2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
flate2 = "1"
tar = "0.4"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }

[profile.release]
lto = "thin"
strip = true
