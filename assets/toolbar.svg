    <ellipse cx="252" cy="360" rx="34" ry="21" fill="#ffa6dc" opacity=".85"/>
    <ellipse cx="486" cy="274" rx="31" ry="23" fill="#ffa6dc" opacity=".85"/>
    <!-- face: a smug lidded eye, a wink and a small smile -->
    <circle cx="292" cy="324" r="32" fill="#2a1873"/>
    <g fill="none" stroke="#2a1873" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 291l80 11" stroke-width="13"/>
      <path d="M444 214l-24 36 36 14" stroke-width="14"/>
      <path d="M364 330c18 26 46 24 62-4 4-8 6-14 6-22" stroke-width="12"/>
    </g>
  </g>
</svg>
