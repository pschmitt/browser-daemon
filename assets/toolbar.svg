<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 32 700 700">
  <defs>
    <linearGradient id="bd-body" x1="0" y1="110" x2="0" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f7f4ff"/>
      <stop offset=".85" stop-color="#ddd3fc"/>
      <stop offset="1" stop-color="#bdaaf8"/>
    </linearGradient>
    <linearGradient id="bd-limb" x1="0" y1="370" x2="0" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8ccfc"/>
    </linearGradient>
  </defs>
  <g>
    <!-- the other arm is behind the body: the little raised one -->
    <path d="M515 310C512 255 542 214 582 216c38 2 48 38 30 84-12 32-46 50-80 44z" fill="url(#bd-limb)" stroke="#5a46c8" stroke-width="7" stroke-linejoin="round" stroke-opacity=".85"/>
    <!-- body -->
    <path d="M110 280C130 190 210 118 320 115c120-3 220 65 260 165 32 80 18 170-32 250-48 70-128 95-208 98-40 2-80 24-115 22-30-2-45-25-60-50C100 560 70 480 70 400c0-50 15-85 40-120z" fill="url(#bd-body)" stroke="#5a46c8" stroke-width="7" stroke-linejoin="round" stroke-opacity=".85"/>
    <path d="M120 470C150 560 200 610 300 628c-60 10-110-8-160-60-40-40-60-110-20-98z" fill="#a994f6" opacity=".35"/>
    <!-- the big arm in front, with its shadow on the body -->
    <ellipse cx="100" cy="448" rx="84" ry="66" transform="rotate(-28 100 448)" fill="#c4b5fa" opacity=".55"/>
    <path d="M42 420C58 380 112 372 152 400c30 22 16 76-30 96-44 20-94 12-104-24-6-20 4-38 24-52z" fill="url(#bd-limb)" stroke="#8e7bea" stroke-width="6" stroke-opacity=".8" stroke-linejoin="round"/>
