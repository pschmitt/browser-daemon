<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bd-body" x1="0" y1="10" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f1eeff"/>
      <stop offset="1" stop-color="#b9a9ff"/>
    </linearGradient>
    <linearGradient id="bd-limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1ff"/>
      <stop offset="1" stop-color="#b3a2ff"/>
    </linearGradient>
  </defs>
  <g stroke="#34227f" stroke-width="1.5" stroke-linejoin="round">
    <!-- feet -->
    <ellipse cx="23" cy="55" rx="5.2" ry="2.7" fill="#8f7cf0"/>
    <ellipse cx="41" cy="55" rx="5.2" ry="2.7" fill="#8f7cf0"/>
    <!-- the waving arm, behind the body -->
    <ellipse cx="56.4" cy="25.5" rx="4.7" ry="9" transform="rotate(22 56.4 25.5)" fill="url(#bd-limb)"/>
    <!-- body -->
    <path d="M5.6 35.6C5.6 21.4 16.4 11.4 32 11.4s26.4 10 26.4 24.2c0 12.6-11.4 19.6-26.4 19.6S5.6 48.2 5.6 35.6z" fill="url(#bd-body)"/>
    <!-- the other arm, in front -->
    <ellipse cx="8.6" cy="41.6" rx="5.4" ry="6.6" transform="rotate(18 8.6 41.6)" fill="url(#bd-limb)"/>
  </g>
  <!-- cheeks -->
  <ellipse cx="18.4" cy="38.4" rx="3.6" ry="2.3" fill="#ff8fc8" opacity="0.75"/>
  <ellipse cx="48.4" cy="38.4" rx="3.6" ry="2.3" fill="#ff8fc8" opacity="0.75"/>
  <!-- face: a lidded, smug eye and a wink -->
  <g fill="none" stroke="#2a1873" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.4 31.2l9 .8" stroke-width="2.3"/>
    <path d="M38.4 34.8c1.5-3.4 5-3.4 6.6 0" stroke-width="2.1"/>
    <path d="M28.8 41c2.2 2 5.2 2 7.4 0" stroke-width="1.8"/>
  </g>
  <circle cx="24" cy="34.8" r="2.1" fill="#2a1873"/>
</svg>
